<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 989.3" role="img" aria-label="1.1.8 영역별 선택적 최대 작용 개념도" data-standard-code="1.1.8" style="font-family:Arial,Malgun Gothic,sans-serif"><title>1.1.8 영역별 선택적 최대 작용 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-1-1-8" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 1.1.8</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">영역별 선택적 최대 작용</tspan></text><g data-standard="1.1.8" data-phase="before"><rect x="16" y="93" width="728" height="270" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 영역별 요구 강도가 다름</tspan></text><path class="sis-edge" data-source="F" data-target="S1" data-style="harmful" d="M267.0,220 L493.0,220" fill="none" stroke="#b05f51" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#sis-1-1-8)"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#b05f51"/><text x="380.0" y="224" text-anchor="middle" fill="#b05f51" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>F 균일한 장</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">F 균일한 장</tspan></text></g><g class="sis-node" data-node="S1" data-kind="pattern"><title>S1 서로 다른 영역</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><rect x="-30" y="-27" width="60" height="54" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-26" y="-24" width="8" height="48" rx="5" fill="rgb(150,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-14" y="-24" width="8" height="48" rx="5" fill="rgb(167,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-2" y="-24" width="8" height="48" rx="5" fill="rgb(184,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="10" y="-24" width="8" height="48" rx="5" fill="rgb(201,190,140)" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1 서로 다른 영역</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  일률적 작용</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-1-1-8)"/><g data-standard="1.1.8" data-phase="after"><rect x="16" y="408" width="728" height="322" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 국부 보호 또는 국부 증강</tspan></text><path class="sis-edge" data-source="A" data-target="B" data-style="action" d="M213.66666666666669,535 L333.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-1-1-8)"/><circle cx="273.33333333333337" cy="535" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="C" data-target="B" data-style="action" d="M546.3333333333334,535 L427.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-1-1-8)"/><circle cx="486.6666666666667" cy="535" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="A" data-kind="shield"><title>강한 F + 보호층</title><circle cx="166.66666666666669" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,535)"><path d="M0,-31 L28,-19 V3 Q22,23 0,32 Q-22,23 -28,3 V-19 Z" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-13,0 L-2,11 L15,-11" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">강한 F + 보호층</tspan></text></g><g class="sis-node" data-node="B" data-kind="pattern"><title>선택 영역만 작용</title><circle cx="380.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,535)"><rect x="-30" y="-27" width="60" height="54" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-26" y="-24" width="8" height="48" rx="5" fill="rgb(150,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-14" y="-24" width="8" height="48" rx="5" fill="rgb(167,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-2" y="-24" width="8" height="48" rx="5" fill="rgb(184,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="10" y="-24" width="8" height="48" rx="5" fill="rgb(201,190,140)" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">선택 영역만 작용</tspan></text></g><g class="sis-node" data-node="C" data-kind="field"><title>약한 F + 국부 증강</title><circle cx="593.3333333333334" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,535)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">약한 F + 국부 </tspan><tspan x="593.3333333333334" dy="26.35">증강</tspan></text></g><text x="43" y="664" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  보호 방식</tspan></text><text x="43" y="689" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  증강 방식</tspan></text></g><text x="32" y="769" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">두 경로는 대안이다. 모든 영역에 같은 강도를 가하지 않는다.</tspan></text><text x="32" y="805.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 전체 최대 장+보호 물질(1.1.8.1) 또는 전체 최소 장+국소 장을 </tspan><tspan x="32" dy="24.8">만드는 물질(1.1.8.2)</tspan></text><text x="32" y="867.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 최대 작용 영역과 최소 작용 영역이 구분되어야 하고 해당 </tspan><tspan x="32" dy="24.8">보호·국소 작용 물질을 사용할 수 있을 때.</tspan></text><text x="32" y="929.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>