="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">필요 입자</tspan></text></g><g class="sis-node" data-node="L" data-kind="particles"><title>인접 하위 미완결 구조</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><circle cx="-16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">인접 하위 미완결 </tspan><tspan x="593.3333333333334" dy="26.35">구조</tspan></text></g><text x="43" y="639" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  5.5.1: 분해</tspan></text><text x="43" y="664" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  5.5.2: 보완 구성</tspan></text></g><text x="32" y="744" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">분해와 구성은 대안이다. 인접 상위의 과잉 구조와 인접 하위의 미완결 구조를 </tspan><tspan x="32" dy="24.8">빠뜨리지 않는다.</tspan></text><text x="32" y="805.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 5.5.1: 인접 상위의 온전한·과잉 구조 분해 / 5.5.2: 인접 </tspan><tspan x="32" dy="24.8">하위의 미완결 구조 보완 구성</tspan></text><text x="32" y="867.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 5.5.1 또는 5.5.2를 적용하면서 입자를 얻는 가장 단순한 </tspan><tspan x="32" dy="24.8">구조 수준의 경로를 고르는 경우.</tspan></text><text x="32" y="928.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>