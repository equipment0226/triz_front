<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1016.1" role="img" aria-label="2.3.1 장과 물질의 리듬 정합 또는 의도적 비정합 개념도" data-standard-code="2.3.1" style="font-family:Arial,Malgun Gothic,sans-serif"><title>2.3.1 장과 물질의 리듬 정합 또는 의도적 비정합 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-2-3-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 2.3.1</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">장과 물질의 리듬 정합 또는 의도적 비정합</tspan></text><g data-standard="2.3.1" data-phase="before"><rect x="16" y="93" width="728" height="297" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 장과 물질의 주파수 관계를 조절해야 함</tspan></text><path class="sis-edge" data-source="F" data-target="S" data-style="link" d="M267.0,220 L493.0,220" fill="none" stroke="#547957" stroke-width="2"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#547957"/><text x="380.0" y="224" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="wave"><title>F 작용 주파수</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">F 작용 주파수</tspan></text></g><g class="sis-node" data-node="S" data-kind="wave"><title>대상·도구 고유 주파수</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">대상·도구 고유 </tspan><tspan x="540.0" dy="26.35">주파수</tspan></text></g><text x="43" y="349" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  현재 주파수 관계</tspan></text></g><path d="M380,399 V426" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-2-3-1)"/><g data-standard="2.3.1" data-phase="after"><rect x="16" y="435" width="728" height="297" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="468" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 정합 또는 의도적 비정합</tspan></text><path class="sis-edge" data-source="F" data-target="S" data-style="both" d="M267.0,562 L493.0,562" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-3-1)" marker-start="url(#sis-2-3-1)"/><circle cx="380.0" cy="562" r="11" fill="white" stroke="#547957"/><text x="380.0" y="566" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="wave"><title>조절한 F 주파수</title><circle cx="220.0" cy="562" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,562)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="632" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">조절한 F 주파수</tspan></text></g><g class="sis-node" data-node="S" data-kind="wave"><title>대상·도구 고유 주파수</title><circle cx="540.0" cy="562" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,562)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="632" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">대상·도구 고유 </tspan><tspan x="540.0" dy="26.35">주파수</tspan></text></g><text x="43" y="691" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  목적에 맞게 정합·비정합 선택</tspan></text></g><text x="32" y="771" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">불일치가 항상 유해한 것은 아니다. 동조가 필요한 경우와 반공진이 필요한 </tspan><tspan x="32" dy="24.8">경우를 구별한다.</tspan></text><text x="32" y="832.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · F의 작용 주파수 ↔ 대상/도구의 고유 주파수: 정합 또는 의도적 </tspan><tspan x="32" dy="24.8">비정합</tspan></text><text x="32" y="894.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 물질–장 모델에서 장과 대상 또는 도구의 고유 리듬 관계가 </tspan><tspan x="32" dy="24.8">작용에 영향을 줄 때.</tspan></text><text x="32" y="955.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>