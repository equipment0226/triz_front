<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 862.6999999999998" role="img" aria-label="5.4.1 가역적 물리 변환에 의한 상태 전환 개념도" data-standard-code="5.4.1" style="font-family:Arial,Malgun Gothic,sans-serif"><title>5.4.1 가역적 물리 변환에 의한 상태 전환 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-5-4-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 5.4.1</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">가역적 물리 변환에 의한 상태 전환</tspan></text><g data-standard="5.4.1" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 서로 다른 상태가 반복 필요함</tspan></text><g class="sis-node" data-node="A" data-kind="substance"><title>상태 A</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">상태 A</tspan></text></g><g class="sis-node" data-node="B" data-kind="substance"><title>상태 B</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">상태 B</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-4-1)"/><g data-standard="5.4.1" data-phase="after"><rect x="16" y="383" width="728" height="270" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 가역적인 물리 변환을 이용</tspan></text><path class="sis-edge" data-source="A" data-target="B" data-style="both" d="M267.0,510 L493.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-4-1)" marker-start="url(#sis-5-4-1)"/><circle cx="380.0" cy="510" r="11" fill="white" stroke="#547957"/><text x="380.0" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="A" data-kind="phase"><title>상태 A</title><circle cx="220.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,510)"><circle cx="0" cy="0" r="29" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><path d="M0,-29 V29" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-5 Q13,-16 27,-5" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">상태 A</tspan></text></g><g class="sis-node" data-node="B" data-kind="phase"><title>상태 B</title><circle cx="540.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,510)"><circle cx="0" cy="0" r="29" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><path d="M0,-29 V29" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-5 Q13,-16 27,-5" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">상태 B</tspan></text></g><text x="43" y="612" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  정방향·복귀 조건</tspan></text></g><text x="32" y="692" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">상전이·해리/결합 등 반복 가능한 변환 경로를 검토한다.</tspan></text><text x="32" y="728.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 주기적으로 필요한 상태 A ↔ 대상 자체의 가역적 변환 ↔ 상태 B</tspan></text><text x="32" y="765.5999999999999" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 대상이 주기적으로 서로 다른 물리적 상태에 있어야 하는 경우.</tspan></text><text x="32" y="802.3999999999999" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>