220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">시스템</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  문제·운전 조건의 제약</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-1-1)"/><g data-standard="5.1.1" data-phase="after"><rect x="16" y="408" width="728" height="364" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 대표 대안 기전 · 아홉 공식 방법은 상세도 참조</tspan></text><path class="sis-edge" data-source="V" data-target="R" data-style="action" d="M140.0,536 C140.0,488 620.0,488 620.0,536" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-1-1)"/><circle cx="380.0" cy="500.0" r="11" fill="white" stroke="#547957"/><text x="380.0" y="504.0" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><path class="sis-edge" data-source="F" data-target="R" data-style="action" d="M300.0,536 C300.0,466 620.0,466 620.0,536" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-1-1)"/><circle cx="460.0" cy="483.5" r="11" fill="white" stroke="#547957"/><text x="460.0" y="487.5" text-anchor="middle" fill="#547957" font-size="12"><tspan x="460.0" dy="0">2</tspan></text><path class="sis-edge" data-source="E" data-target="R" data-style="action" d="M507.0,579 L573.0,579" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-1-1)"/><circle cx="540.0" cy="579" r="11" fill="white" stroke="#547957"/><text x="540.0" y="583" text-anchor="middle" fill="#547957" font-size="12"><tspan x="540.0" dy="0">3</tspan></text><g class="sis-node" data-node="V" data-kind="hollow"><title>빈 공간·공동</title><circle cx="140.0" cy="579" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(140.0,579)"><rect x="-29" y="-27" width="58" height="54" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="-14" y="-13" width="28" height="26" rx="5" fill="white" stroke="#4c725e" stroke-width="2"/></g><text x="140.0" y="649" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="140.0" dy="0">빈 공간·공동</tspan></text></g><g class="sis-node" data-node="F" data-kind="field"><title>대체 장</title><circle cx="300.0" cy="579" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(300.0,579)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300.0" y="649" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="300.0" dy="0">대체 장</tspan></text></g><g class="sis-node" data-node="E" data-kind="environment"><title>기존 물질·환경</title><circle cx="460.0" cy="579" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(460.0,579)"><path d="M-31,17 Q-30,-1 -16,-1 Q-14,-27 6,-17 Q24,-26 29,-4 Q42,11 25,20 H-21" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6,-2 V13 M-12,7 L-6,14 L0,7" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="460.0" y="649" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="460.0" dy="0">기존 물질·환경</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>필요 기능</title><circle cx="620.0" cy="579" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,579)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="620.0" y="649" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">필요 기능</tspan></text></g><text x="43" y="681" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  5.1.1.1: 공동으로 대체</tspan></text><text x="43" y="706" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  5.1.1.2: 장으로 대체</tspan></text><text x="43" y="731" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  5.1.1.9: 현장 생성</tspan></text></g><text x="32" y="811" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">이 개요는 세 대표 경로를 보인다. 공식 5.1.1.1~5.1.1.9의 모든 방법은 </tspan><tspan x="32" dy="24.8">별도 상세 개념도로 제공하며 각 방법은 대안이다.</tspan></text><text x="32" y="872.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 금지된 직접 물질 도입 → 공식 하위 방법 5.1.1.1~5.1.1.9 중 </tspan><tspan x="32" dy="24.8">적합한 우회 경로</tspan></text><text x="32" y="934.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 새 물질의 도입이 필요하지만 문제 조건상 금지되거나 시스템 </tspan><tspan x="32" dy="24.8">운전 조건상 허용되지 않는 경우.</tspan></text><text x="32" y="995.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>