<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 937.3" role="img" aria-label="3.1.2 결합 시스템의 연결 발전 개념도" data-standard-code="3.1.2" style="font-family:Arial,Malgun Gothic,sans-serif"><title>3.1.2 결합 시스템의 연결 발전 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-3-1-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 3.1.2</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">결합 시스템의 연결 발전</tspan></text><g data-standard="3.1.2" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 결합 시스템의 현재 연결 상태</tspan></text><g class="sis-node" data-node="A" data-kind="system"><title>연결 없는 집합</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">연결 없는 집합</tspan></text></g><g class="sis-node" data-node="B" data-kind="system"><title>강체로 연결된 집합</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">강체로 연결된 집합</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-3-1-2)"/><g data-standard="3.1.2" data-phase="after"><rect x="16" y="383" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 현재 상태에 따라 선택하는 두 경로</tspan></text><path class="sis-edge" data-source="A0" data-target="A1" data-style="action" d="M187.0,510 L253.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-3-1-2)"/><circle cx="220.0" cy="510" r="11" fill="white" stroke="#547957"/><text x="220.0" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="220.0" dy="0">1</tspan></text><path class="sis-edge" data-source="B0" data-target="B1" data-style="action" d="M507.0,510 L573.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-3-1-2)"/><circle cx="540.0" cy="510" r="11" fill="white" stroke="#547957"/><text x="540.0" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="540.0" dy="0">2</tspan></text><g class="sis-node" data-node="A0" data-kind="segmented"><title>연결 없는 집합</title><circle cx="140.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(140.0,510)"><rect x="-25" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="-25" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="140.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="140.0" dy="0">연결 없는 집합</tspan></text></g><g class="sis-node" data-node="A1" data-kind="system"><title>유효한 연결</title><circle cx="300.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(300.0,510)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="300.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="300.0" dy="0">유효한 연결</tspan></text></g><g class="sis-node" data-node="B0" data-kind="system"><title>강체 연결</title><circle cx="460.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(460.0,510)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="460.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="460.0" dy="0">강체 연결</tspan></text></g><g class="sis-node" data-node="B1" data-kind="flexible"><title>동적인 연결</title><circle cx="620.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,510)"><path d="M-28,19 L-10,-14 L10,14 L28,-19" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-28" cy="19" r="5" fill="white" stroke="#4c725e" stroke-width="2"/><circle cx="-10" cy="-14" r="5" fill="white" stroke="#4c725e" stroke-width="2"/><circle cx="10" cy="14" r="5" fill="white" stroke="#4c725e" stroke-width="2"/><circle cx="28" cy="-19" r="5" fill="white" stroke="#4c725e" stroke-width="2"/></g><text x="620.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">동적인 연결</tspan></text></g><text x="43" y="612" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  대안 1: 연결 도입·강화</tspan></text><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  대안 2: 기존 연결 동적화</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">무연결 집합은 연결을 강화한다. 이미 강체 연결이면 동적성을 높인다. 두 갈래를 </tspan><tspan x="32" dy="24.8">하나의 필수 순서로 잇지 않는다.</tspan></text><text x="32" y="778.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 무연결 집합 → 요소 사이 유효한 연결; 강체 연결 → 더 동적인 연결</tspan></text><text x="32" y="815.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 이미 구성된 바이·폴리 시스템의 효율을 높이는 경우. 무연결 </tspan><tspan x="32" dy="24.8">상태와 강체 연결 상태를 구별하여 서로 다른 발전 방향을 선택한다.</tspan></text><text x="32" y="877.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>