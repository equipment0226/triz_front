5e" stroke-width="2"/><rect x="-26" y="-24" width="8" height="48" rx="5" fill="rgb(150,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-14" y="-24" width="8" height="48" rx="5" fill="rgb(167,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-2" y="-24" width="8" height="48" rx="5" fill="rgb(184,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="10" y="-24" width="8" height="48" rx="5" fill="rgb(201,190,140)" stroke="#4c725e" stroke-width="2"/></g><text x="593.3333333333334" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">형성되는 물질 구조</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  요구 구조에 맞춰 설정</tspan></text><text x="43" y="347" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  장으로 물질 구조 형성</tspan></text></g><text x="32" y="423" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 만들려는 물질의 공간 구조에 맞는 구조의 장에서 공정을 수행한다.</tspan></text><text x="32" y="459.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 모델에 있거나 참여 가능한 물질에 특정 공간 구조를 부여해야 </tspan><tspan x="32" dy="24.8">할 때.</tspan></text><text x="32" y="521.4000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>