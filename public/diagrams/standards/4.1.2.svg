oke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">필요한 검출·측정</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  정보가 필요함</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-4-1-2)"/><g data-standard="4.1.2" data-phase="after"><rect x="16" y="408" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 복제물 또는 영상을 측정</tspan></text><path class="sis-edge" data-source="S" data-target="C" data-style="link" d="M213.66666666666669,535 L333.0,535" fill="none" stroke="#547957" stroke-width="2"/><circle cx="273.33333333333337" cy="535" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="C" data-target="M" data-style="action" d="M427.0,535 L546.3333333333334,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-1-2)"/><circle cx="486.6666666666667" cy="535" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="S" data-kind="substance"><title>실물 대상</title><circle cx="166.66666666666669" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,535)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="166.66666666666669" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">실물 대상</tspan></text></g><g class="sis-node" data-node="C" data-kind="copy"><title>대응 영상·복제물</title><circle cx="380.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,535)"><rect x="-28" y="-25" width="43" height="45" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-13" y="-12" width="43" height="45" rx="5" fill="#edf3df" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">대응 영상·복제물</tspan></text></g><g class="sis-node" data-node="M" data-kind="sensor"><title>측정기</title><circle cx="593.3333333333334" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,535)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">측정기</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  대응 관계</tspan></text><text x="43" y="662" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  간접 측정</tspan></text></g><text x="32" y="742" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">4.1.1을 적용할 수 없을 때 검토한다. 복제물·영상과 실제 대상 사이의 대응 </tspan><tspan x="32" dy="24.8">관계를 이용한다.</tspan></text><text x="32" y="803.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 실물의 직접 검출·측정 → 복제물·사진의 검출·측정; 비교 시 대상 </tspan><tspan x="32" dy="24.8">영상과 대비되는 기준 영상의 중첩</tspan></text><text x="32" y="865.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 검출·측정 문제에서 4.1.1로 필요 자체를 없앨 수 없을 때. </tspan><tspan x="32" dy="24.8">광학 중첩 분기는 비교할 기준물 또는 그 영상이 있을 때 적용한다.</tspan></text><text x="32" y="926.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>