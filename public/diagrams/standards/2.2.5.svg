<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 887.3" role="img" aria-label="2.2.5 장의 공간·시간 구조화 개념도" data-standard-code="2.2.5" style="font-family:Arial,Malgun Gothic,sans-serif"><title>2.2.5 장의 공간·시간 구조화 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-2-2-5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 2.2.5</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">장의 공간·시간 구조화</tspan></text><g data-standard="2.2.5" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 균일한 작용장</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>균일 F</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">균일 F</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-2-2-5)"/><g data-standard="2.2.5" data-phase="after"><rect x="16" y="383" width="728" height="245" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 장의 분포를 구조화</tspan></text><g class="sis-node" data-node="F1" data-kind="gradient"><title>공간 구배 F</title><circle cx="220.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,510)"><path d="M-24,18 V0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12,18 V-8" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,18 V-16" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12,18 V-24" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M24,18 V-30" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">공간 구배 F</tspan></text></g><g class="sis-node" data-node="F2" data-kind="pulse"><title>시간 패턴 F</title><circle cx="540.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,510)"><path d="M-27,5 H-19 V-14 H-6 V12 H7 V-14 H20 V5 H28" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">시간 패턴 F</tspan></text></g></g><text x="32" y="667" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">공간과 시간의 패턴은 선택하거나 결합할 수 있다.</tspan></text><text x="32" y="703.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 균일/무질서한 F → 일정 또는 시간에 따라 변하는 구조화된 F; </tspan><tspan x="32" dy="24.8">필요하면 F의 구조로 물질 구조 형성</tspan></text><text x="32" y="765.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 모델의 효율 개선에 특정 장 분포, 물질의 공간 구조 또는 </tspan><tspan x="32" dy="24.8">에너지 집중·비작용 구역이 필요할 때.</tspan></text><text x="32" y="827.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>