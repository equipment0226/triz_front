<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 937.3" role="img" aria-label="1.1.2 내부 복합 물질–장 개념도" data-standard-code="1.1.2" style="font-family:Arial,Malgun Gothic,sans-serif"><title>1.1.2 내부 복합 물질–장 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-1-1-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 1.1.2</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">내부 복합 물질–장</tspan></text><g data-standard="1.1.2" data-phase="before"><rect x="16" y="93" width="728" height="270" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 장에 대한 반응 부족</tspan></text><path class="sis-edge" data-source="F" data-target="S1" data-style="harmful" d="M267.0,220 L493.0,220" fill="none" stroke="#b05f51" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#sis-1-1-2)"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#b05f51"/><text x="380.0" y="224" text-anchor="middle" fill="#b05f51" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>F 기존 장</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">F 기존 장</tspan></text></g><g class="sis-node" data-node="S1" data-kind="substance"><title>S1 원래 물질</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1 원래 물질</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  반응 부족</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-1-1-2)"/><g data-standard="1.1.2" data-phase="after"><rect x="16" y="408" width="728" height="270" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 물질 내부에 첨가</tspan></text><path class="sis-edge" data-source="F" data-target="S1" data-style="action" d="M267.0,535 L493.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-1-1-2)"/><circle cx="380.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="380.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>F 기존 장</title><circle cx="220.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,535)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">F 기존 장</tspan></text></g><g class="sis-node" data-node="S1" data-kind="composite"><title>S1 내부의 S3</title><circle cx="540.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,535)"><rect x="-31" y="-27" width="62" height="54" rx="10" fill="#f0f5e7" stroke="#4c725e" stroke-width="2"/><circle cx="-16" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="540.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1 내부의 S3</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  내부 첨가로 반응 개선</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">S3는 S1 또는 S2 내부에 포함된다.</tspan></text><text x="32" y="753.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · S1 또는 S2 → 첨가물 S3를 내부에 포함하는 복합 물질; 일시적 </tspan><tspan x="32" dy="24.8">또는 영구적 첨가</tspan></text><text x="32" y="815.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 기존 물질–장 모델의 변화가 어렵고 기존 물질 내부의 첨가에 </tspan><tspan x="32" dy="24.8">제한이 없을 때.</tspan></text><text x="32" y="877.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>