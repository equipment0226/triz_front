<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 887.6999999999998" role="img" aria-label="5.2.2 환경에 존재하는 장 개념도" data-standard-code="5.2.2" style="font-family:Arial,Malgun Gothic,sans-serif"><title>5.2.2 환경에 존재하는 장 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-5-2-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 5.2.2</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">환경에 존재하는 장</tspan></text><g data-standard="5.2.2" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 내부에서 사용할 장이 부족함</tspan></text><g class="sis-node" data-node="S" data-kind="system"><title>시스템 내부</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">시스템 내부</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-2-2)"/><g data-standard="5.2.2" data-phase="after"><rect x="16" y="383" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 환경에 존재하는 장을 사용</tspan></text><path class="sis-edge" data-source="E" data-targe