<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 962.3" role="img" aria-label="3.1.3 구성요소의 차이 확대 개념도" data-standard-code="3.1.3" style="font-family:Arial,Malgun Gothic,sans-serif"><title>3.1.3 구성요소의 차이 확대 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-3-1-3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 3.1.3</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">구성요소의 차이 확대</tspan></text><g data-standard="3.1.3" data-phase="before"><rect x="16" y="93" width="728" height="270" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 같은 성질의 요소들</tspan></text><path class="sis-edge" data-source="A" data-target="B" data-style="link" d="M267.0,220 L493.0,220" fill="none" stroke="#547957" stroke-width="2"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#547957"/><text x="380.0" y="224" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="A" data-kind="system"><title>동일 요소 A</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">동일 요소 A</tspan></text></g><g class="sis-node" data-node="B" data-kind="system"><title>동일 요소 A</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">동일 요소 A</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  결합</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-3-1-3)"/><g data-standard="3.1.3" data-phase="after"><rect x="16" y="408" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 성질 차이의 확대</tspan></text><path class="sis-edge" data-source="A" data-target="B" data-style="action" d="M213.66666666666669,535 L333.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-3-1-3)"/><circle cx="273.33333333333337" cy="535" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="B" data-target="C" data-style="action" d="M427.0,535 L546.3333333333334,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-3-1-3)"/><circle cx="486.6666666666667" cy="535" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="A" data-kind="system"><title>특성이 다른 요소</title><circle cx="166.66666666666669" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,535)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="166.66666666666669" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">특성이 다른 요소</tspan></text></g><g class="sis-node" data-node="B" data-kind="pattern"><title>이종 요소</title><circle cx="380.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,535)"><rect x="-30" y="-27" width="60" height="54" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-26" y="-24" width="8" height="48" rx="5" fill="rgb(150,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-14" y="-24" width="8" height="48" rx="5" fill="rgb(167,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-2" y="-24" width="8" height="48" rx="5" fill="rgb(184,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="10" y="-24" width="8" height="48" rx="5" fill="rgb(201,190,140)" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">이종 요소</tspan></text></g><g class="sis-node" data-node="C" data-kind="system"><title>상반 성질 요소</title><circle cx="593.3333333333334" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,535)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="593.3333333333334" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">상반 성질 요소</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  차이 확대</tspan></text><text x="43" y="662" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  차이 확대</tspan></text></g><text x="32" y="742" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">비슷한 요소의 집합에서 이종·반대 성질의 조합으로 발전한다.</tspan></text><text x="32" y="778.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 동일 요소 → 특성이 이동된 요소 → 서로 다른 요소 → 요소와 반대 </tspan><tspan x="32" dy="24.8">요소의 조합</tspan></text><text x="32" y="840.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 바이·폴리 시스템에서 구성요소 사이 차이를 확대하여 효율을 </tspan><tspan x="32" dy="24.8">높이는 경우.</tspan></text><text x="32" y="902.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>