<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 887.3" role="img" aria-label="2.2.6 물질의 공간·시간 구조화 개념도" data-standard-code="2.2.6" style="font-family:Arial,Malgun Gothic,sans-serif"><title>2.2.6 물질의 공간·시간 구조화 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-2-2-6" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 2.2.6</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">물질의 공간·시간 구조화</tspan></text><g data-standard="2.2.6" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 균질한 물질</tspan></text><g class="sis-node" data-node="S" data-kind="substance"><title>균질 S</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">균질 S</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-2-2-6)"/><g data-standard="2.2.6" data-phase="after"><rect x="16" y="383" width="728" height="245" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 물질의 성질을 구조화</tspan></text><g class="sis-node" data-node="S1" data-kind="pattern"><title>위치별 물성 S</title><circle cx="220.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,510)"><rect x="-30" y="-27" width="60" height="54" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-26" y="-24" width="8" height="48" rx="5" fill="rgb(150,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-14" y="-24" width="8" height="48" rx="5" fill="rgb(167,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-2" y="-24" width="8" height="48" rx="5" fill="rgb(184,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="10" y="-24" width="8" height="48" rx="5" fill="rgb(201,190,140)" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">위치별 물성 S</tspan></text></g><g class="sis-node" data-node="S2" data-kind="phase"><title>상태가 변하는 S</title><circle cx="540.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,510)"><circle cx="0" cy="0" r="29" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><path d="M0,-29 V29" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-5 Q13,-16 27,-5" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">상태가 변하는 S</tspan></text></g></g><text x="32" y="667" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">장 자체를 바꾸는 2.2.5와 달리 물질의 분포·상태를 바꾼다.</tspan></text><text x="32" y="703.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 균일/무질서한 S → 공간·시간 구조가 정해진 S; 국소 열 필요 시 </tspan><tspan x="32" dy="24.8">해당 위치에 발열 물질</tspan></text><text x="32" y="765.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 물질–장 모델의 효율 개선에 물질의 구조화가 필요하거나 특정 </tspan><tspan x="32" dy="24.8">점·선에 강한 열 작용이 필요할 때.</tspan></text><text x="32" y="827.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>