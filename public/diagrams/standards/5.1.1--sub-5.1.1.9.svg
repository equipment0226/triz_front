 marker-end="url(#sis-detail-5-1-1-sub-5-1-1-9)"/><circle cx="540.0" cy="220" r="11" fill="white" stroke="#547957"/><text x="540.0" y="224" text-anchor="middle" fill="#547957" font-size="12"><tspan x="540.0" dy="0">3</tspan></text><g class="sis-node" data-node="S" data-kind="environment"><title>기존 대상·환경 물질</title><circle cx="140.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(140.0,220)"><path d="M-31,17 Q-30,-1 -16,-1 Q-14,-27 6,-17 Q24,-26 29,-4 Q42,11 25,20 H-21" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6,-2 V13 M-12,7 L-6,14 L0,7" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="140.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="140.0" dy="0">기존 대상·환경 </tspan><tspan x="140.0" dy="26.35">물질</tspan></text></g><g class="sis-node" data-node="D" data-kind="phase"><title>분해·상변화</title><circle cx="300.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(300.0,220)"><circle cx="0" cy="0" r="29" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><path d="M0,-29 V29" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-5 Q13,-16 27,-5" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="300.0" dy="0">분해·상변화</tspan></text></g><g class="sis-node" data-node="A" data-kind="substance"><title>필요 첨가물</title><circle cx="460.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(460.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="460.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="460.0" dy="0">필요 첨가물</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>필요 기능</title><circle cx="620.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,220)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="620.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">필요 기능</tspan></text></g><text x="43" y="349" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  기존 자원 변환</tspan></text><text x="43" y="374" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  현장에서 물질 생성</tspan></text><text x="43" y="399" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  생성 물질 활용</tspan></text></g><text x="32" y="475" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 대상이나 외부 환경을 전기분해 등의 방법으로 분해하거나, 그 </tspan><tspan x="32" dy="24.8">일부의 물리적 상태(고체·액체·기체 등)를 바꾸어 첨가제를 얻는다.</tspan></text><text x="32" y="536.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 외부 첨가 대신 대상 또는 환경 자체로부터 필요한 첨가제를 </tspan><tspan x="32" dy="24.8">얻어 도입 제약을 우회하는 경우.</tspan></text><text x="32" y="598.2" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>