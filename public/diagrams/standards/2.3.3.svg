<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 937.4999999999999" role="img" aria-label="2.3.3 양립하기 어려운 작용의 휴지기 활용 개념도" data-standard-code="2.3.3" style="font-family:Arial,Malgun Gothic,sans-serif"><title>2.3.3 양립하기 어려운 작용의 휴지기 활용 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-2-3-3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 2.3.3</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">양립하기 어려운 작용의 휴지기 활용</tspan></text><g data-standard="2.3.3" data-phase="before"><rect x="16" y="93" width="728" height="270" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 동시 작용이 서로 방해함</tspan></text><path class="sis-edge" data-source="A" data-target="B" data-style="harmful" d="M267.0,220 L493.0,220" fill="none" stroke="#b05f51" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#sis-2-3-3)"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#b05f51"/><text x="380.0" y="224" text-anchor="middle" fill="#b05f51" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="A" data-kind="process"><title>작용 A</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">작용 A</tspan></text></g><g class="sis-node" data-node="B" data-kind="process"><title>작용 B</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">작용 B</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  동시 수행 충돌</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-2-3-3)"/><g data-standard="2.3.3" data-phase="after"><rect x="16" y="408" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 휴지기에 다른 작용 배치</tspan></text><path class="sis-edge" data-source="A1" data-target="B" data-style="action" d="M213.66666666666669,535 L333.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-3-3)"/><circle cx="273.33333333333337" cy="535" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="B" data-target="A2" data-style="action" d="M427.0,535 L546.3333333333334,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-3-3)"/><circle cx="486.6666666666667" cy="535" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="A1" data-kind="pulse"><title>A 수행</title><circle cx="166.66666666666669" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,535)"><path d="M-27,5 H-19 V-14 H-6 V12 H7 V-14 H20 V5 H28" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">A 수행</tspan></text></g><g class="sis-node" data-node="B" data-kind="pulse"><title>A 휴지기에 B</title><circle cx="380.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,535)"><path d="M-27,5 H-19 V-14 H-6 V12 H7 V-14 H20 V5 H28" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">A 휴지기에 B</tspan></text></g><g class="sis-node" data-node="A2" data-kind="pulse"><title>A 재개</title><circle cx="593.3333333333334" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,535)"><path d="M-27,5 H-19 V-14 H-6 V12 H7 V-14 H20 V5 H28" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">A 재개</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  시간 순서</tspan></text><text x="43" y="662" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  시간 순서</tspan></text></g><text x="32" y="742" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">예: 가공이 멈춘 사이 측정. 화살표는 시간 진행이다.</tspan></text><text x="32" y="778.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 작용 A와 B의 동시 충돌 → A의 휴지기에 B 실행</tspan></text><text x="32" y="815.5999999999999" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 두 작용이 양립하기 어렵거나 별도로 수행되며 한 작용의 </tspan><tspan x="32" dy="24.8">휴지기에 다른 유익한 작용을 넣을 수 있을 때.</tspan></text><text x="32" y="877.1999999999999" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>