<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 937.3" role="img" aria-label="3.2.1 미시 수준으로 전이 개념도" data-standard-code="3.2.1" style="font-family:Arial,Malgun Gothic,sans-serif"><title>3.2.1 미시 수준으로 전이 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-3-2-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 3.2.1</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">미시 수준으로 전이</tspan></text><g data-standard="3.2.1" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 거시적 부품이 기능 수행</tspan></text><g class="sis-node" data-node="M" data-kind="system"><title>거시적 기구</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">거시적 기구</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-3-2-1)"/><g data-standard="3.2.1" data-phase="after"><rect x="16" y="383" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 미시 구조가 기능 수행</tspan></text><path class="sis-edge" data-source="S" data-target="F" data-style="link" d="M213.66666666666669,510 L333.0,510" fill="none" stroke="#547957" stroke-width="2"/><circle cx="273.33333333333337" cy="510" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="F" data-target="R" data-style="action" d="M427.0,510 L546.3333333333334,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-3-2-1)"/><circle cx="486.6666666666667" cy="510" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="S" data-kind="particles"><title>분자·미시 구조</title><circle cx="166.66666666666669" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,510)"><circle cx="-16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="166.66666666666669" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">분자·미시 구조</tspan></text></g><g class="sis-node" data-node="F" data-kind="field"><title>미시적 작용</title><circle cx="380.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,510)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">미시적 작용</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>필요 기능</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">필요 기능</tspan></text></g><text x="43" y="612" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  구조·물성</tspan></text><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  기능 구현</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">단순 소형화가 아니라 기능을 수행하는 구조 수준을 바꾼다.</tspan></text><text x="32" y="753.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 거시 시스템·부분 → 장과 상호작용하는 물질의 작용; 미시 수준 → </tspan><tspan x="32" dy="24.8">더 낮은 미시 수준도 가능</tspan></text><text x="32" y="815.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 대체 물질과 장의 상호작용이 필요한 기능을 수행하는 경우. </tspan><tspan x="32" dy="24.8">발전 여력 소진은 전제가 아니며, 단순한 외형 소형화만을 뜻하지 않는다.</tspan></text><text x="32" y="877.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>