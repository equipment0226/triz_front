oke-width="2" marker-end="url(#sis-2-4-11)" marker-start="url(#sis-2-4-11)"/><circle cx="273.33333333333337" cy="537" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="541" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="I" data-target="J" data-style="both" d="M427.0,537 L546.3333333333334,537" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-4-11)" marker-start="url(#sis-2-4-11)"/><circle cx="486.6666666666667" cy="537" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="541" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="F" data-kind="magnet"><title>외부 전자기장</title><circle cx="166.66666666666669" cy="537" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,537)"><path d="M-23,-20 V6 Q-23,29 0,29 Q23,29 23,6 V-20 H9 V6 Q9,14 0,14 Q-9,14 -9,6 V-20 Z" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="-16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="-16" dy="0">N</tspan></text><text x="16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="16" dy="0">S</tspan></text></g><text x="166.66666666666669" y="607" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">외부 전자기장</tspan></text></g><g class="sis-node" data-node="I" data-kind="current"><title>접촉 공급·유도 전류</title><circle cx="380.0" cy="537" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,537)"><path d="M-26,2 H-9 L-2,-16 L6,18 L13,2 H28" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="607" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">접촉 공급·유도 </tspan><tspan x="380.0" dy="26.35">전류</tspan></text></g><g class="sis-node" data-node="J" data-kind="current"><title>다른 전류</title><circle cx="593.3333333333334" cy="537" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,537)"><path d="M-26,2 H-9 L-2,-16 L6,18 L13,2 H28" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="607" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">다른 전류</tspan></text></g><text x="43" y="666" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  대안 1: 외부 장과 전류</tspan></text><text x="43" y="691" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  대안 2: 전류끼리 상호작용</tspan></text></g><text x="32" y="771" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">두 경로는 대안이다. 전류×전류도 포함하며 단순 정전기장만을 뜻하지 않는다.</tspan></text><text x="32" y="807.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 강자성 입자 대신 전류 사용: 외부 전자기장×접촉/유도 전류 또는 </tspan><tspan x="32" dy="24.8">전류×전류</tspan></text><text x="32" y="869.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 강자성체 도입이나 자화가 어렵고 전류 또는 전자기장과 전류의 </tspan><tspan x="32" dy="24.8">상호작용을 사용할 수 있을 때.</tspan></text><text x="32" y="931.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>