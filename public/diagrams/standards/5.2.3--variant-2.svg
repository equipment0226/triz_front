ont-size="15"><tspan x="43" dy="0">2  자기 상호작용·정보 활용</tspan></text></g><text x="32" y="450" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 기존 강자성 물질의 자성을 이용해 요소 간 상호작용을 개선하거나 </tspan><tspan x="32" dy="24.8">시스템의 작동·상태 정보를 얻는다.</tspan></text><text x="32" y="511.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 시스템에 강자성 물질이 있으나 그때까지 기계적 용도로만 </tspan><tspan x="32" dy="24.8">사용한 경우.</tspan></text><text x="32" y="573.2" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>