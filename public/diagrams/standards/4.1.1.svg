<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 937.3" role="img" aria-label="4.1.1 측정 필요성의 제거 개념도" data-standard-code="4.1.1" style="font-family:Arial,Malgun Gothic,sans-serif"><title>4.1.1 측정 필요성의 제거 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-4-1-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 4.1.1</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">측정 필요성의 제거</tspan></text><g data-standard="4.1.1" data-phase="before"><rect x="16" y="93" width="728" height="270" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 검출·측정이 필요한 시스템</tspan></text><path class="sis-edge" data-source="S" data-target="M" data-style="action" d="M267.0,220 L493.0,220" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-1-1)"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#547957"/><text x="380.0" y="224" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="S" data-kind="system"><title>기존 시스템</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">기존 시스템</tspan></text></g><g class="sis-node" data-node="M" data-kind="sensor"><title>필요한 검출·측정</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">필요한 검출·측정</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  정보가 필요함</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-4-1-1)"/><g data-standard="4.1.1" data-phase="after"><rect x="16" y="408" width="728" height="270" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 시스템 변경으로 측정 필요 제거</tspan></text><path class="sis-edge" data-source="S" data-target="R" data-style="action" d="M267.0,535 L493.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-1-1)"/><circle cx="380.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="380.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="S" data-kind="system"><title>변경된 시스템</title><circle cx="220.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,535)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">변경된 시스템</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>원래 필요한 기능</title><circle cx="540.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,535)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">원래 필요한 기능</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  측정 없이 필요한 결과</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">검출·측정 문제에서 우선 검토하는 우회 경로다. 자기 조절만으로 한정하지 </tspan><tspan x="32" dy="24.8">않는다.</tspan></text><text x="32" y="778.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 검출·측정이 필요한 시스템 → 그 필요가 사라지도록 바꾼 시스템</tspan></text><text x="32" y="815.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 검출 또는 측정 문제가 주어진 경우에 우선 검토하는 우회 </tspan><tspan x="32" dy="24.8">경로이다.</tspan></text><text x="32" y="877.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>