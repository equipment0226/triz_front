540.0" dy="0">시스템</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-2-1)"/><g data-standard="5.2.1" data-phase="after"><rect x="16" y="383" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 시스템 내부의 장을 재활용</tspan></text><path class="sis-edge" data-source="E" data-target="F" data-style="action" d="M213.66666666666669,510 L333.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-2-1)"/><circle cx="273.33333333333337" cy="510" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="F" data-target="S" data-style="action" d="M427.0,510 L546.3333333333334,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-2-1)"/><circle cx="486.6666666666667" cy="510" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="E" data-kind="system"><title>시스템의 기존 장</title><circle cx="166.66666666666669" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,510)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="166.66666666666669" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">시스템의 기존 장</tspan></text></g><g class="sis-node" data-node="F" data-kind="field"><title>가용 F</title><circle cx="380.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,510)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">가용 F</tspan></text></g><g class="sis-node" data-node="S" data-kind="substance"><title>작용 대상</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">작용 대상</tspan></text></g><text x="43" y="612" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  재배치</tspan></text><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  필요 기능</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">기존 기능과 에너지 사용이 충돌하는지 확인한다.</tspan></text><text x="32" y="753.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 시스템 물질에 이미 있는 장 → 필요한 기능에 겸용</tspan></text><text x="32" y="790.5999999999999" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 물질–장 시스템에 장의 도입이 필요한 경우. 먼저 시스템 </tspan><tspan x="32" dy="24.8">물질이 이미 운반하는 장의 이용을 검토한다.</tspan></text><text x="32" y="852.1999999999999" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>