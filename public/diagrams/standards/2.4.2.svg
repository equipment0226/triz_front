<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 962.1" role="img" aria-label="2.4.2 강자성 입자를 이용한 Fe-Field 개념도" data-standard-code="2.4.2" style="font-family:Arial,Malgun Gothic,sans-serif"><title>2.4.2 강자성 입자를 이용한 Fe-Field · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-2-4-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 2.4.2</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">강자성 입자를 이용한 Fe-Field</tspan></text><g data-standard="2.4.2" data-phase="before"><rect x="16" y="93" width="728" height="270" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 제어 효율을 높이려는 기존 시스템</tspan></text><path class="sis-edge" data-source="F" data-target="S" data-style="action" d="M267.0,220 L493.0,220" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-4-2)"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#547957"/><text x="380.0" y="224" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>기존 장</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">기존 장</tspan></text></g><g class="sis-node" data-node="S" data-kind="substance"><title>기존 물질</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">기존 물질</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  기존 작용</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-2-4-2)"/><g data-standard="2.4.2" data-phase="after"><rect x="16" y="408" width="728" height="270" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 강자성 입자의 교체·첨가와 자기 제어</tspan></text><path class="sis-edge" data-source="F" data-target="S" data-style="action" d="M267.0,535 L493.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-4-2)"/><circle cx="380.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="380.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="magnet"><title>자기·전자기장</title><circle cx="220.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,535)"><path d="M-23,-20 V6 Q-23,29 0,29 Q23,29 23,6 V-20 H9 V6 Q9,14 0,14 Q-9,14 -9,6 V-20 Z" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="-16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="-16" dy="0">N</tspan></text><text x="16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="16" dy="0">S</tspan></text></g><text x="220.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">자기·전자기장</tspan></text></g><g class="sis-node" data-node="S" data-kind="particles"><title>강자성 입자</title><circle cx="540.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,535)"><circle cx="-16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="540.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">강자성 입자</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  입자 분포·운동 제어</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">기존 물질을 자성 입자로 바꾸거나 입자를 첨가한다. 출발 물질이 이미 </tspan><tspan x="32" dy="24.8">강자성이어야 하는 것은 아니다.</tspan></text><text x="32" y="778.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 물질의 교체 또는 강자성 입자 첨가 + 자기/전자기장 → 분산 </tspan><tspan x="32" dy="24.8">강자성 물질–장 모델</tspan></text><text x="32" y="840.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 시스템 제어 효율을 높이기 위해 강자성 입자의 교체·첨가와 </tspan><tspan x="32" dy="24.8">자기 또는 전자기장을 사용할 수 있을 때.</tspan></text><text x="32" y="901.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>