 data-kind="process"><title>필요 기능</title><circle cx="620.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,220)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="620.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">필요 기능</tspan></text></g><text x="43" y="349" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  화합물 형태로 먼저 도입</tspan></text><text x="43" y="374" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  필요 물질을 나중에 꺼냄</tspan></text><text x="43" y="399" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  방출 후 작용</tspan></text></g><text x="32" y="475" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 첨가제를 화합물 형태로 도입하고 나중에 그 화합물에서 필요한 </tspan><tspan x="32" dy="24.8">첨가제를 방출한다.</tspan></text><text x="32" y="536.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 첨가제를 직접 도입하는 제약을 화합물 형태의 도입과 후속 </tspan><tspan x="32" dy="24.8">방출로 우회하는 경우.</tspan></text><text x="32" y="598.2" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>