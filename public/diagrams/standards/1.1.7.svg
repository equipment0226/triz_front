<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 962.3" role="img" aria-label="1.1.7 최대 작용을 다른 물질에 전달 개념도" data-standard-code="1.1.7" style="font-family:Arial,Malgun Gothic,sans-serif"><title>1.1.7 최대 작용을 다른 물질에 전달 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-1-1-7" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 1.1.7</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">최대 작용을 다른 물질에 전달</tspan></text><g data-standard="1.1.7" data-phase="before"><rect x="16" y="93" width="728" height="270" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 필요한 최대 작용을 직접 가할 수 없음</tspan></text><path class="sis-edge" data-source="F" data-target="S1" data-style="harmful" d="M267.0,220 L493.0,220" fill="none" stroke="#b05f51" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#sis-1-1-7)"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#b05f51"/><text x="380.0" y="224" text-anchor="middle" fill="#b05f51" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>F 최대 작용</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">F 최대 작용</tspan></text></g><g class="sis-node" data-node="S1" data-kind="substance"><title>S1 대상</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1 대상</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  직접 작용 불허</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-1-1-7)"/><g data-standard="1.1.7" data-phase="after"><rect x="16" y="408" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 연결된 다른 물질로 작용을 돌림</tspan></text><path class="sis-edge" data-source="F" data-target="S2" data-style="action" d="M213.66666666666669,535 L333.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-1-1-7)"/><circle cx="273.33333333333337" cy="535" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="S2" data-target="S1" data-style="action" d="M427.0,535 L546.3333333333334,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-1-1-7)"/><circle cx="486.6666666666667" cy="535" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>F 최대 작용</title><circle cx="166.66666666666669" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,535)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">F 최대 작용</tspan></text></g><g class="sis-node" data-node="S2" data-kind="substance"><title>S2 연결 물질</title><circle cx="380.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,535)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">S2 연결 물질</tspan></text></g><g class="sis-node" data-node="S1" data-kind="substance"><title>S1 대상</title><circle cx="593.3333333333334" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,535)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="593.3333333333334" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">S1 대상</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  최대 작용 유지</tspan></text><text x="43" y="662" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  필요 결과 전달</tspan></text></g><text x="32" y="742" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">최대 작용이 필요하다는 전제다. 단순한 과잉 작용 억제와 구별한다.</tspan></text><text x="32" y="778.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 대상에 허용되지 않는 최대 작용 → 연결된 다른 물질에 최대 작용 </tspan><tspan x="32" dy="24.8">→ 대상에 필요한 결과 전달</tspan></text><text x="32" y="840.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 최대 작용이 필요하고 그 작용을 대상에 직접 가할 수 없으며 </tspan><tspan x="32" dy="24.8">대상과 연결해 결과를 전달할 물질을 사용할 때.</tspan></text><text x="32" y="902.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>