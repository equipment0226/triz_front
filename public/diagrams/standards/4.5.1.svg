 시스템</tspan></text><path class="sis-edge" data-source="M1" data-target="R" data-style="action" d="M213.66666666666669,510 L333.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-5-1)"/><circle cx="273.33333333333337" cy="510" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="M2" data-target="R" data-style="action" d="M546.3333333333334,510 L427.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-5-1)"/><circle cx="486.6666666666667" cy="510" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="M1" data-kind="sensor"><title>대상 집합·측정계 A</title><circle cx="166.66666666666669" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,510)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">대상 집합·측정계 A</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>내부 환경·신호 관계</title><circle cx="380.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,510)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">내부 환경·신호 </tspan><tspan x="380.0" dy="26.35">관계</tspan></text></g><g class="sis-node" data-node="M2" data-kind="sensor"><title>대상 집합·측정계 B</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">대상 집합·측정계 B</tspan></text></g><text x="43" y="639" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  결합된 측정 정보</tspan></text><text x="43" y="664" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  관계 활용</tspan></text></g><text x="32" y="744" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">어느 발전 단계에서도 검토한다. 대상 집합의 내부 환경 또는 복수 측정 신호의 </tspan><tspan x="32" dy="24.8">관계를 활용할 수 있다.</tspan></text><text x="32" y="805.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 측정 시스템 → 바이·폴리 시스템; 대상 집합의 내부 환경 또는 </tspan><tspan x="32" dy="24.8">복수 측정의 관계 활용</tspan></text><text x="32" y="867.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 측정 시스템의 효율을 높이려는 경우이며 어느 발전 단계에서나 </tspan><tspan x="32" dy="24.8">검토할 수 있다.</tspan></text><text x="32" y="928.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>