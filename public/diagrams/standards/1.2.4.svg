e8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1 대상</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  유익 + 유해 작용</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-1-2-4)"/><g data-standard="1.2.4" data-phase="after"><rect x="16" y="408" width="728" height="320" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 두 물질과 유익 작용 유지·제2장 추가</tspan></text><path class="sis-edge" data-source="F1" data-target="S2" data-style="action" d="M187.0,535 L253.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-1-2-4)"/><circle cx="220.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="220.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="220.0" dy="0">1</tspan></text><path class="sis-edge" data-source="S2" data-target="S1" data-style="action" d="M347.0,535 L413.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-1-2-4)"/><circle cx="380.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="380.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">2</tspan></text><path class="sis-edge" data-source="F2" data-target="S1" data-style="action" d="M573.0,535 L507.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-1-2-4)"/><circle cx="540.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="540.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="540.0" dy="0">3</tspan></text><g class="sis-node" data-node="F1" data-kind="field"><title>F1 기존 장</title><circle cx="140.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(140.0,535)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="140.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="140.0" dy="0">F1 기존 장</tspan></text></g><g class="sis-node" data-node="S2" data-kind="substance"><title>S2 도구</title><circle cx="300.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(300.0,535)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="300.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="300.0" dy="0">S2 도구</tspan></text></g><g class="sis-node" data-node="S1" data-kind="substance"><title>S1 대상</title><circle cx="460.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(460.0,535)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="460.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="460.0" dy="0">S1 대상</tspan></text></g><g class="sis-node" data-node="F2" data-kind="field"><title>F2 추가 장</title><circle cx="620.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,535)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="620.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">F2 추가 장</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  기존 작용 공급</tspan></text><text x="43" y="662" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  직접 접촉·유익 작용 유지</tspan></text><text x="43" y="687" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  유해 작용 중화·유익 전환</tspan></text></g><text x="32" y="767" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">S1·S2의 직접 접촉을 유지한다. S3 분리층을 삽입하는 방식이 아니다.</tspan></text><text x="32" y="803.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 동일 물질 쌍과 F1의 유익 작용 유지 + 유해 작용 대응용 F2 추가</tspan></text><text x="32" y="840.5999999999999" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 유익·유해 작용이 결합되어 있고 두 물질의 직접 접촉을 </tspan><tspan x="32" dy="24.8">반드시 보존해야 할 때.</tspan></text><text x="32" y="902.1999999999999" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>