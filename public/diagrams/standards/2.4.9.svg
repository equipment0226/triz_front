l="white" stroke="#547957"/><text x="486.6666666666667" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="F" data-kind="gradient"><title>공간 구조를 가진 장</title><circle cx="166.66666666666669" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,535)"><path d="M-24,18 V0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12,18 V-8" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,18 V-16" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12,18 V-24" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M24,18 V-30" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">공간 구조를 가진 </tspan><tspan x="166.66666666666669" dy="26.35">장</tspan></text></g><g class="sis-node" data-node="S2" data-kind="particles"><title>강자성 입자계</title><circle cx="380.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,535)"><circle cx="-16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="380.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">강자성 입자계</tspan></text></g><g class="sis-node" data-node="S1" data-kind="pattern"><title>요구 구조의 대상</title><circle cx="593.3333333333334" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,535)"><rect x="-30" y="-27" width="60" height="54" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-26" y="-24" width="8" height="48" rx="5" fill="rgb(150,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-14" y="-24" width="8" height="48" rx="5" fill="rgb(167,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="-2" y="-24" width="8" height="48" rx="5" fill="rgb(184,190,140)" stroke="#4c725e" stroke-width="2"/><rect x="10" y="-24" width="8" height="48" rx="5" fill="rgb(201,190,140)" stroke="#4c725e" stroke-width="2"/></g><text x="593.3333333333334" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">요구 구조의 대상</tspan></text></g><text x="43" y="664" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  위치별 장 작용</tspan></text><text x="43" y="689" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  필요한 물질 구조 형성</tspan></text></g><text x="32" y="769" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">일반형은 장의 구조화다. 구조화된 열장으로 자성을 달리하거나 장에 맞춰 물질 </tspan><tspan x="32" dy="24.8">구조를 만드는 분기도 있다.</tspan></text><text x="32" y="830.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · Fe-Field의 F → 일정/가변 공간 구조를 가진 F; 필요하면 </tspan><tspan x="32" dy="24.8">구조화된 장으로 요구 물질 구조 형성</tspan></text><text x="32" y="892.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · Fe-Field 효율을 높이기 위해 장의 구조가 필요하거나 참여 </tspan><tspan x="32" dy="24.8">물질에 특정 공간 구조를 부여해야 할 때.</tspan></text><text x="32" y="953.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>