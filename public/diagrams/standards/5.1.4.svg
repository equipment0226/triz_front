<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 939.1" role="img" aria-label="5.1.4 팽창 구조·거품으로 부피 확보 개념도" data-standard-code="5.1.4" style="font-family:Arial,Malgun Gothic,sans-serif"><title>5.1.4 팽창 구조·거품으로 부피 확보 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-5-1-4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 5.1.4</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">팽창 구조·거품으로 부피 확보</tspan></text><g data-standard="5.1.4" data-phase="before"><rect x="16" y="93" width="728" height="272" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 필요한 대량 물질 도입이 제한됨</tspan></text><g class="sis-node" data-node="S" data-kind="missing"><title>도입할 수 없는 대량 물질</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd" stroke-dasharray="4 4"/><g transform="translate(380.0,220)"><text x="0" y="13" text-anchor="middle" fill="#98a294" font-size="38"><tspan x="0" dy="0">?</tspan></text></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">도입할 수 없는 </tspan><tspan x="380.0" dy="26.35">대량 물질</tspan></text></g></g><path d="M380,374 V401" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-1-4)"/><g data-standard="5.1.4" data-phase="after"><rect x="16" y="410" width="728" height="245" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="443" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 거시·미시의 빈 공간 활용</tspan></text><g class="sis-node" data-node="A" data-kind="hollow"><title>거시: 팽창식 구조</title><circle cx="220.0" cy="537" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,537)"><rect x="-29" y="-27" width="58" height="54" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="-14" y="-13" width="28" height="26" rx="5" fill="white" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="607" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">거시: 팽창식 구조</tspan></text></g><g class="sis-node" data-node="B" data-kind="foam"><title>미시: 거품</title><circle cx="540.0" cy="537" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,537)"><rect x="-31" y="-27" width="62" height="54" rx="10" fill="#f0f5e7" stroke="#4c725e" stroke-width="2"/><circle cx="-16" cy="-8" r="6" fill="white" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-8" r="6" fill="white" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-8" r="6" fill="white" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="8" r="6" fill="white" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="8" r="6" fill="white" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="8" r="6" fill="white" stroke="#4c725e" stroke-width="1"/></g><text x="540.0" y="607" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">미시: 거품</tspan></text></g></g><text x="32" y="694" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">두 크기 수준의 대안이다. 빈 공간으로 물질의 역할을 대신하며 물질량 자체가 </tspan><tspan x="32" dy="24.8">증가하는 것은 아니다.</tspan></text><text x="32" y="755.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 금지된 대량 물질 도입 → 팽창식 구조 또는 거품 형태의 빈 공간 </tspan><tspan x="32" dy="24.8">활용</tspan></text><text x="32" y="817.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 많은 양의 물질이 필요하지만 문제 조건이 금지하거나 운전 </tspan><tspan x="32" dy="24.8">조건이 허용하지 않는 경우.</tspan></text><text x="32" y="878.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>