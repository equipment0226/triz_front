<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 988.9" role="img" aria-label="5.1.2 대상을 나누어 도구로 사용 개념도" data-standard-code="5.1.2" style="font-family:Arial,Malgun Gothic,sans-serif"><title>5.1.2 대상을 나누어 도구로 사용 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-5-1-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 5.1.2</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">대상을 나누어 도구로 사용</tspan></text><g data-standard="5.1.2" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 변경이 어렵고 도구 교체·첨가가 허용되지 않음</tspan></text><g class="sis-node" data-node="S1" data-kind="substance"><title>기존 대상 S1</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">기존 대상 S1</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-1-2)"/><g data-standard="5.1.2" data-phase="after"><rect x="16" y="383" width="728" height="297" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 대상의 일부가 다른 일부에 작용</tspan></text><path class="sis-edge" data-source="A" data-target="B" data-style="both" d="M267.0,510 L493.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-1-2)" marker-start="url(#sis-5-1-2)"/><circle cx="380.0" cy="510" r="11" fill="white" stroke="#547957"/><text x="380.0" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="A" data-kind="segmented"><title>S1a 대상의 일부</title><circle cx="220.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,510)"><rect x="-25" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="-25" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">S1a 대상의 일부</tspan></text></g><g class="sis-node" data-node="B" data-kind="segmented"><title>S1b 대상의 다른 일부</title><circle cx="540.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,510)"><rect x="-25" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="-25" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1b 대상의 다른 </tspan><tspan x="540.0" dy="26.35">일부</tspan></text></g><text x="43" y="639" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  상호작용</tspan></text></g><text x="32" y="719" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">S1을 나누어 물질–장 관계를 만든다. 기존 도구가 반드시 없어야 한다는 전제는 </tspan><tspan x="32" dy="24.8">없다.</tspan></text><text x="32" y="780.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 교체 도구·추가 물질 대신 대상 S1 → 서로 작용하는 S1a·S1b; </tspan><tspan x="32" dy="24.8">미세입자 흐름에는 전하 배치 분기 적용</tspan></text><text x="32" y="842.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 시스템에 필요한 변경을 가하기 어렵고, 문제 조건이 도구 </tspan><tspan x="32" dy="24.8">교체 또는 첨가제 도입을 허용하지 않는 경우. 전하 분기는 시스템에 미세입자 </tspan><tspan x="32" dy="24.8">흐름이 있고 그 제어성을 높여야 하는 경우.</tspan></text><text x="32" y="928.6" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>