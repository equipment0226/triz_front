<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 759" role="img" aria-label="5.1.2 대상을 나누어 도구로 사용 구조도" data-standard-code="5.1.2" style="font-family:Arial,Malgun Gothic,sans-serif"><title>5.1.2 대상을 나누어 도구로 사용 · 개념 변환</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-5-1-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 5.1.2</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">대상을 나누어 도구로 사용</tspan></text><g data-standard="5.1.2" data-phase="before"><rect x="16" y="90" width="728" height="246" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="123" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 도구가 없고 새 도구 도입이 어려움</tspan></text><g class="sis-node" data-node="S1" data-kind="substance"><title>대상 S1</title><circle cx="380.0" cy="229" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,229)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="299" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">대상 S1</tspan></text></g></g><path d="M380,345 V372" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-1-2)"/><g data-standard="5.1.2" data-phase="after"><rect x="16" y="381" width="728" height="296" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="414" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 대상의 일부가 다른 일부에 작용</tspan></text><path class="sis-edge" data-source="A" data-target="B" d="M267.0,520 L493.0,520" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-1-2)" marker-start="url(#sis-5-1-2)"/><circle cx="380.0" cy="520" r="11" fill="white" stroke="#547957"/><text x="380.0" y="524" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="A" data-kind="segmented"><title>S1a 대상의 일부</title><circle cx="220.0" cy="520" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,520)"><rect x="-25" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="-25" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="590" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">S1a 대상의 일부</tspan></text></g><g class="sis-node" data-node="B" data-kind="segmented"><title>S1b 대상의 다른 일부</title><circle cx="540.0" cy="520" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,520)"><rect x="-25" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="-25" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-25" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="4" width="21" height="21" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="590" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1b 대상의 </tspan><tspan x="540.0" dy="26.35">다른 일부</tspan></text></g><text x="43" y="632" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  상호작용</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">S1을 나누어 물질–장 관계를 만들며 외부 S2를 가정하지 않는다.</tspan></text></svg>