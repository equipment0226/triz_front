6669" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,535)"><circle cx="0" cy="0" r="29" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><path d="M0,-29 V29" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-5 Q13,-16 27,-5" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">상 A·부분 A</tspan></text></g><g class="sis-node" data-node="B" data-kind="phase"><title>상 B·부분 B</title><circle cx="380.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,535)"><circle cx="0" cy="0" r="29" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><path d="M0,-29 V29" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-5 Q13,-16 27,-5" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">상 B·부분 B</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>향상된 유익 작용</title><circle cx="593.3333333333334" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,535)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">향상된 유익 작용</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  물리적 또는 화학적 상호작용</tspan></text><text x="43" y="662" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  상호작용 효과 활용</tspan></text></g><text x="32" y="742" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">5.3.4 이후의 보강이다. 물리·화학 작용은 대안이며 단순 공존 자체와 구별한다.</tspan></text><text x="32" y="778.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 5.3.4로 얻은 두 상 시스템 → 부분·상 사이의 물리적 또는 </tspan><tspan x="32" dy="24.8">화학적 상호작용 도입</tspan></text><text x="32" y="840.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 5.3.4의 상전이 4로 얻은 시스템의 효과를 높이려는 경우.</tspan></text><text x="32" y="877.1999999999999" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>