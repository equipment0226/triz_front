x="540.0" dy="0">조절한 F2 주파수</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  정합·의도적 비정합</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">장–물질의 고유 주파수 관계가 아니라 사용되는 여러 장 사이의 주파수 관계다.</tspan></text><text x="32" y="753.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 복수 장의 주파수 관계 → 정합 또는 의도적 비정합</tspan></text><text x="32" y="790.5999999999999" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 복합 물질–장 모델에서 둘 이상의 장이 사용되고 그 주파수 </tspan><tspan x="32" dy="24.8">관계를 정할 필요가 있을 때.</tspan></text><text x="32" y="852.1999999999999" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>