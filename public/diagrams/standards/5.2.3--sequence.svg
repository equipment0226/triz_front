<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1068.7000000000003" role="img" aria-label="5.2.3 · 발전·적용 순서 개념도" data-standard-code="5.2.3" data-standard-detail="sequence" style="font-family:Arial,Malgun Gothic,sans-serif"><title>5.2.3 · 발전·적용 순서 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-detail-5-2-3-sequence" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">원전의 발전·적용 순서</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">5.2.3 · 발전·적용 순서</tspan></text><g data-detail-mechanism="true"><rect x="16" y="93" width="728" height="322" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 기전 · 기존 물질이 장 운반·발생 역할 겸용</tspan></text><path class="sis-edge" data-source="S" data-target="F" data-style="action" d="M213.66666666666669,220 L333.0,220" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-detail-5-2-3-sequence)"/><circle cx="273.33333333333337" cy="220" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="224" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="F" data-target="R" data-style="action" d="M427.0,220 L546.3333333333334,220" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-detail-5-2-3-sequence)"/><circle cx="486.6666666666667" cy="220" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="224" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="S" data-kind="substance"><title>시스템·환경의 기존 물질</title><circle cx="166.66666666666669" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="166.66666666666669" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">시스템·환경의 </tspan><tspan x="166.66666666666669" dy="26.35">기존 물질</tspan></text></g><g class="sis-node" data-node="F" data-kind="field"><title>운반·발생한 장</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">운반·발생한 장</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>필요 기능</title><circle cx="593.3333333333334" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,220)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">필요 기능</tspan></text></g><text x="43" y="349" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  장 운반체·발생원 겸용</tspan></text><text x="43" y="374" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  필요 작용</tspan></text></g><g data-sequence-path="1"><text x="32" y="450" text-anchor="start" fill="#647b55" font-size="17"><tspan x="32" dy="0">발전·적용 경로</tspan></text><g data-sequence-stage="1" data-kind="field"><rect x="32" y="488.35" width="696" height="98" rx="15" fill="#ecf3e1" stroke="#d8e2cd"/><g transform="translate(85,537.35)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="137" y="520.35" text-anchor="start" fill="#273b43" font-size="17"><tspan x="137" dy="0">5.2.1: 시스템 물질이 이미 운반하는 장을 먼저 이용한다.</tspan></text></g><path class="sequence-edge" data-source-stage="1" data-target-stage="2" d="M85,591.35 V622.35" stroke="#547957" stroke-width="2" fill="none" marker-end="url(#sis-detail-5-2-3-sequence)"/><text x="117" y="611.35" text-anchor="start" fill="#273b43" font-size="13"><tspan x="117" dy="0">이 경로로 불가능하면</tspan></text><g data-sequence-stage="2" data-kind="environment"><rect x="32" y="630.35" width="696" height="98" rx="15" fill="#ecf3e1" stroke="#d8e2cd"/><g transform="translate(85,679.35)"><path d="M-31,17 Q-30,-1 -16,-1 Q-14,-27 6,-17 Q24,-26 29,-4 Q42,11 25,20 H-21" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6,-2 V13 M-12,7 L-6,14 L0,7" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="137" y="662.35" text-anchor="start" fill="#273b43" font-size="17"><tspan x="137" dy="0">5.2.1로 불가능하면 5.2.2: 외부 환경에 이미 존재하는 </tspan><tspan x="137" dy="26.35">장을 이용한다.</tspan></text></g><path class="sequence-edge" data-source-stage="2" data-target-stage="3" d="M85,733.35 V764.35" stroke="#547957" stroke-width="2" fill="none" marker-end="url(#sis-detail-5-2-3-sequence)"/><text x="117" y="753.35" text-anchor="start" fill="#273b43" font-size="13"><tspan x="117" dy="0">이 경로로 불가능하면</tspan></text><g data-sequence-stage="3" data-kind="substance"><rect x="32" y="772.35" width="696" height="98" rx="15" fill="#ecf3e1" stroke="#d8e2cd"/><g transform="translate(85,821.35)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="137" y="804.35" text-anchor="start" fill="#273b43" font-size="17"><tspan x="137" dy="0">5.2.1과 5.2.2로 모두 불가능하면 5.2.3: 기존 </tspan><tspan x="137" dy="26.35">시스템·환경 물질을 장의 운반체나 발생원으로 겸용한다.</tspan></text></g></g><text x="32" y="905.35" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 내부·환경의 기존 장 직접 이용 불가 → 기존 물질을 장의 운반체 </tspan><tspan x="32" dy="24.8">또는 발생원으로 겸용</tspan></text><text x="32" y="966.95" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 장이 필요하지만 5.2.1과 5.2.2로 도입할 수 없는 경우. </tspan><tspan x="32" dy="24.8">자성 활용 분기는 시스템의 강자성 물질이 기계적 용도로만 사용되는 경우.</tspan></text><text x="32" y="1028.5500000000002" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>