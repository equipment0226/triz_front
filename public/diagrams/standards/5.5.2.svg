<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 962.1" role="img" aria-label="5.5.2 하위 입자의 결합으로 입자 확보 개념도" data-standard-code="5.5.2" style="font-family:Arial,Malgun Gothic,sans-serif"><title>5.5.2 하위 입자의 결합으로 입자 확보 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-5-5-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 5.5.2</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">하위 입자의 결합으로 입자 확보</tspan></text><g data-standard="5.5.2" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 직접 획득·상위 구조 분해가 모두 불가</tspan></text><g class="sis-node" data-node="P" data-kind="missing"><title>필요한 입자</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd" stroke-dasharray="4 4"/><g transform="translate(380.0,220)"><text x="0" y="13" text-anchor="middle" fill="#98a294" font-size="38"><tspan x="0" dy="0">?</tspan></text></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">필요한 입자</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-5-2)"/><g data-standard="5.5.2" data-phase="after"><rect x="16" y="383" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 하위 구조에서 보완 구성·결합</tspan></text><path class="sis-edge" data-source="L" data-target="C" data-style="action" d="M213.66666666666669,510 L333.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-5-2)"/><circle cx="273.33333333333337" cy="510" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="C" data-target="P" data-style="action" d="M427.0,510 L546.3333333333334,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-5-2)"/><circle cx="486.6666666666667" cy="510" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="L" data-kind="particles"><title>하위 수준 입자</title><circle cx="166.66666666666669" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,510)"><circle cx="-16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="166.66666666666669" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">하위 수준 입자</tspan></text></g><g class="sis-node" data-node="C" data-kind="process"><title>보완 구성·결합</title><circle cx="380.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,510)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">보완 구성·결합</tspan></text></g><g class="sis-node" data-node="P" data-kind="composite"><title>필요한 입자</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><rect x="-31" y="-27" width="62" height="54" rx="10" fill="#f0f5e7" stroke="#4c725e" stroke-width="2"/><circle cx="-16" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">필요한 입자</tspan></text></g><text x="43" y="612" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  부족한 구성 보완·결합</tspan></text><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  필요 입자 획득</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">직접 획득과 5.5.1이 불가할 때의 대안이다. 단순 소형 부품 조립으로만 </tspan><tspan x="32" dy="24.8">한정하지 않는다.</tspan></text><text x="32" y="778.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 직접 획득 및 5.5.1 적용 불가 → 하위 구조 입자의 보완 </tspan><tspan x="32" dy="24.8">구성·결합 → 목표 입자</tspan></text><text x="32" y="840.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 필요한 물질 입자를 직접 얻거나 5.5.1에 따라 얻는 것이 </tspan><tspan x="32" dy="24.8">불가능한 경우.</tspan></text><text x="32" y="901.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>