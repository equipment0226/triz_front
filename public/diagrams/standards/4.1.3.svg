"#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">요구 정밀도</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  측정 필요</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-4-1-3)"/><g data-standard="4.1.3" data-phase="after"><rect x="16" y="408" width="728" height="320" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 두 상태의 순차 검출과 전이 계수</tspan></text><path class="sis-edge" data-source="A" data-target="B" data-style="action" d="M187.0,535 L253.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-1-3)"/><circle cx="220.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="220.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="220.0" dy="0">1</tspan></text><path class="sis-edge" data-source="B" data-target="N" data-style="action" d="M347.0,535 L413.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-1-3)"/><circle cx="380.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="380.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">2</tspan></text><path class="sis-edge" data-source="N" data-target="R" data-style="action" d="M507.0,535 L573.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-1-3)"/><circle cx="540.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="540.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="540.0" dy="0">3</tspan></text><g class="sis-node" data-node="A" data-kind="sensor"><title>상태 A 검출</title><circle cx="140.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(140.0,535)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="140.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="140.0" dy="0">상태 A 검출</tspan></text></g><g class="sis-node" data-node="B" data-kind="sensor"><title>상태 B 검출</title><circle cx="300.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(300.0,535)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="300.0" dy="0">상태 B 검출</tspan></text></g><g class="sis-node" data-node="N" data-kind="process"><title>전이 횟수 계수</title><circle cx="460.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(460.0,535)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="460.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="460.0" dy="0">전이 횟수 계수</tspan></text></g><g class="sis-node" data-node="R" data-kind="sensor"><title>측정량 산출</title><circle cx="620.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,535)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="620.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">측정량 산출</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  정밀도 단위의 상태 전이</tspan></text><text x="43" y="662" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  전이 검출</tspan></text><text x="43" y="687" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  횟수로 측정</tspan></text></g><text x="32" y="767" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">4.1.1과 4.1.2가 불가할 때의 대안이다. 단순한 연속 파형 관찰이나 4.5.2의 </tspan><tspan x="32" dy="24.8">미분 측정과 구별한다.</tspan></text><text x="32" y="828.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 측정 → 요구 정밀도 단위로 구분한 상태 → 두 상태의 순차 검출 → </tspan><tspan x="32" dy="24.8">전이 횟수로 측정량 산출</tspan></text><text x="32" y="890.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 측정 문제가 주어지고 4.1.1 및 4.1.2를 적용할 수 없을 </tspan><tspan x="32" dy="24.8">때. 원전 해설은 연속 측정에도 유한한 요구 정밀도가 있음을 이용한다.</tspan></text><text x="32" y="951.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>