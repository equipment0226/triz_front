16" dy="0">N</tspan></text><text x="16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="16" dy="0">S</tspan></text></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">자기 출력</tspan></text></g><g class="sis-node" data-node="M" data-kind="sensor"><title>검출기</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">검출기</tspan></text></g><text x="43" y="639" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  상태 반영</tspan></text><text x="43" y="664" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  복합체 측정</tspan></text></g><text x="32" y="744" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">주재료를 유지한 복합 자기 측정 모델이다.</tspan></text><text x="32" y="780.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 강자성 입자로 물질 대체 불가 → 기존 물질 + 강자성 첨가물 → </tspan><tspan x="32" dy="24.8">복합 Fe-Field의 자기 출력</tspan></text><text x="32" y="842.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · Fe-Field로 전환하여 검출·측정을 강화하려는 경우이면서 </tspan><tspan x="32" dy="24.8">기존 물질의 강자성 입자 대체가 허용되지 않을 때.</tspan></text><text x="32" y="904.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>