circle cx="166.66666666666669" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">장 주파수 f1</tspan></text></g><g class="sis-node" data-node="S" data-kind="system"><title>대상 고유 주파수 f2</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">대상 고유 주파수 </tspan><tspan x="380.0" dy="26.35">f2</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>불필요한 동조 회피</title><circle cx="593.3333333333334" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,220)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">불필요한 동조 회피</tspan></text></g><text x="43" y="349" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  f1과 f2를 의도적으로 비정합</tspan></text><text x="43" y="374" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  요구되는 비정합 작용</tspan></text></g><text x="32" y="450" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 주파수를 의도적으로 달리하여 원치 않는 동조·공진을 피한다.</tspan></text><text x="32" y="486.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 정합이 유해하고 비정합으로 필요한 작용을 얻는 경우.</tspan></text><text x="32" y="523.6" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>