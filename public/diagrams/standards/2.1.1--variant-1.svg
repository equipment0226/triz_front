957" stroke-width="2" marker-end="url(#sis-detail-2-1-1-variant-1)"/><circle cx="460.0" cy="163.0" r="11" fill="white" stroke="#547957"/><text x="460.0" y="167.0" text-anchor="middle" fill="#547957" font-size="12"><tspan x="460.0" dy="0">3</tspan></text><g class="sis-node" data-node="S2" data-kind="system"><title>기존 요소 S2</title><circle cx="140.0" cy="242" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(140.0,242)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="140.0" y="312" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="140.0" dy="0">기존 요소 S2</tspan></text></g><g class="sis-node" data-node="S3" data-kind="substance"><title>내부 물질 S3</title><circle cx="300.0" cy="242" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(300.0,242)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="300.0" y="312" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="300.0" dy="0">내부 물질 S3</tspan></text></g><g class="sis-node" data-node="F2" data-kind="field"><title>내부 장 F2</title><circle cx="460.0" cy="242" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(460.0,242)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="460.0" y="312" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="460.0" dy="0">내부 장 F2</tspan></text></g><g class="sis-node" data-node="S4" data-kind="substance"><title>내부 물질 S4</title><circle cx="620.0" cy="242" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,242)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="620.0" y="312" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">내부 물질 S4</tspan></text></g><text x="43" y="344" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  요소를 독립 모델로 확장</tspan></text><text x="43" y="369" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  내부 작용</tspan></text><text x="43" y="394" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  내부 물질–장 관계</tspan></text></g><text x="32" y="470" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · S1 또는 S2를 S3·S4·F2의 독립 제어 모델로 바꾸며 새 요소도 </tspan><tspan x="32" dy="24.8">다시 확장할 수 있다.</tspan></text><text x="32" y="531.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 부분 요소의 독립 제어가 전체 효율에 필요할 때.</tspan></text><text x="32" y="568.4" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>