nd="magnet"><title>입자에 따른 자기 신호</title><circle cx="380.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,510)"><path d="M-23,-20 V6 Q-23,29 0,29 Q23,29 23,6 V-20 H9 V6 Q9,14 0,14 Q-9,14 -9,6 V-20 Z" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="-16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="-16" dy="0">N</tspan></text><text x="16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="16" dy="0">S</tspan></text></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">입자에 따른 자기 </tspan><tspan x="380.0" dy="26.35">신호</tspan></text></g><g class="sis-node" data-node="M" data-kind="sensor"><title>검출기</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">검출기</tspan></text></g><text x="43" y="639" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  분포·상태 반영</tspan></text><text x="43" y="664" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  측정</tspan></text></g><text x="32" y="744" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">입자화하거나 자성 입자를 도입해 검출성을 높인다.</tspan></text><text x="32" y="780.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · Proto-Fe-Field·일반 모델 → 한 물질의 강자성 입자 대체 또는 </tspan><tspan x="32" dy="24.8">첨가 → 자기장 검출·측정</tspan></text><text x="32" y="842.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · Proto-Fe-Field 또는 일반 물질-장 모델의 검출·측정 </tspan><tspan x="32" dy="24.8">효율을 높이려는 경우.</tspan></text><text x="32" y="904.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>