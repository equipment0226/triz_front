<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 937.3" role="img" aria-label="4.5.2 변화율·고차 변화량의 측정 개념도" data-standard-code="4.5.2" style="font-family:Arial,Malgun Gothic,sans-serif"><title>4.5.2 변화율·고차 변화량의 측정 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-4-5-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 4.5.2</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">변화율·고차 변화량의 측정</tspan></text><g data-standard="4.5.2" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 함수값 자체를 측정</tspan></text><g class="sis-node" data-node="X" data-kind="sensor"><title>함수값 f(x)</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">함수값 f(x)</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-4-5-2)"/><g data-standard="4.5.2" data-phase="after"><rect x="16" y="383" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 1차·2차 도함수 측정으로 발전</tspan></text><path class="sis-edge" data-source="X" data-target="V" data-style="action" d="M213.66666666666669,510 L333.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-5-2)"/><circle cx="273.33333333333337" cy="510" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="V" data-target="A" data-style="action" d="M427.0,510 L546.3333333333334,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-5-2)"/><circle cx="486.6666666666667" cy="510" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="X" data-kind="sensor"><title>함수값 f(x)</title><circle cx="166.66666666666669" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,510)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">함수값 f(x)</tspan></text></g><g class="sis-node" data-node="V" data-kind="wave"><title>1차 도함수 f′(x)</title><circle cx="380.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,510)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">1차 도함수 f′(x)</tspan></text></g><g class="sis-node" data-node="A" data-kind="wave"><title>2차 도함수 f″(x)</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">2차 도함수 f″(x)</tspan></text></g><text x="43" y="612" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  1차 도함수 측정</tspan></text><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  2차 도함수 측정</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">함수값 → 1차 → 2차 도함수의 발전 방향이다. 독립변수를 시간으로만 제한하지 </tspan><tspan x="32" dy="24.8">않는다.</tspan></text><text x="32" y="778.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 함수값 측정 → 1차 도함수 측정 → 2차 도함수 측정</tspan></text><text x="32" y="815.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 측정 시스템의 발전 방향이다. 원전은 특정한 시간 변화나 </tspan><tspan x="32" dy="24.8">빠른 현상에만 적용하도록 제한하지 않는다.</tspan></text><text x="32" y="877.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>