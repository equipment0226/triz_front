0" dy="0">모델을 통한 </tspan><tspan x="620.0" dy="26.35">필요 기능</tspan></text></g><text x="43" y="371" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  실제를 대신할 모델 구성</tspan></text><text x="43" y="396" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  모델에는 첨가 허용</tspan></text><text x="43" y="421" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  대응 관계 이용</tspan></text></g><text x="32" y="497" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 실제 대상 대신 첨가가 허용되는 복제물 또는 모델을 사용한다.</tspan></text><text x="32" y="533.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 실제 대상에는 첨가할 수 없지만 복제물·모델에는 첨가할 수 </tspan><tspan x="32" dy="24.8">있는 경우.</tspan></text><text x="32" y="595.4" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>