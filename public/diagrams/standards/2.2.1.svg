<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 937.3" role="img" aria-label="2.2.1 제어하기 쉬운 장으로 전환 개념도" data-standard-code="2.2.1" style="font-family:Arial,Malgun Gothic,sans-serif"><title>2.2.1 제어하기 쉬운 장으로 전환 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-2-2-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 2.2.1</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">제어하기 쉬운 장으로 전환</tspan></text><g data-standard="2.2.1" data-phase="before"><rect x="16" y="93" width="728" height="270" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 현재 장의 제어가 어려움</tspan></text><path class="sis-edge" data-source="F" data-target="S1" data-style="harmful" d="M267.0,220 L493.0,220" fill="none" stroke="#b05f51" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#sis-2-2-1)"/><circle cx="380.0" cy="220" r="11" fill="white" stroke="#b05f51"/><text x="380.0" y="224" text-anchor="middle" fill="#b05f51" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>제어가 어려운 F</title><circle cx="220.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,220)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">제어가 어려운 F</tspan></text></g><g class="sis-node" data-node="S1" data-kind="substance"><title>S1 대상</title><circle cx="540.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1 대상</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  불안정한 작용</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-2-2-1)"/><g data-standard="2.2.1" data-phase="after"><rect x="16" y="408" width="728" height="270" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 제어성이 높은 장으로 교체</tspan></text><path class="sis-edge" data-source="F" data-target="S1" data-style="action" d="M267.0,535 L493.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-2-1)"/><circle cx="380.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="380.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="F" data-kind="pulse"><title>조절 가능한 F′</title><circle cx="220.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,535)"><path d="M-27,5 H-19 V-14 H-6 V12 H7 V-14 H20 V5 H28" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="220.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">조절 가능한 F′</tspan></text></g><g class="sis-node" data-node="S1" data-kind="substance"><title>S1 대상</title><circle cx="540.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,535)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">S1 대상</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  정밀한 작용</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">보편적인 장의 우열이 아니라 해당 조건의 제어성을 비교한다.</tspan></text><text x="32" y="753.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 제어 불가능/곤란한 작업 장 → 잘 제어되는 작업 장; 예: </tspan><tspan x="32" dy="24.8">중력→기계적 작용, 기계적 작용→전기적 작용</tspan></text><text x="32" y="815.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 물질–장 모델이 있고 기존 작업 장의 제어가 어렵거나 </tspan><tspan x="32" dy="24.8">불가능하며 더 제어 가능한 장으로 대체할 수 있을 때.</tspan></text><text x="32" y="877.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>