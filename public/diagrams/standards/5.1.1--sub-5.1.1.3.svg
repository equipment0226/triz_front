e><circle cx="166.66666666666669" cy="220" r="43" fill="white" stroke="#ccd9bd" stroke-dasharray="4 4"/><g transform="translate(166.66666666666669,220)"><text x="0" y="13" text-anchor="middle" fill="#98a294" font-size="38"><tspan x="0" dy="0">?</tspan></text></g><text x="166.66666666666669" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">내부 첨가 제한</tspan></text></g><g class="sis-node" data-node="A" data-kind="layer"><title>외부 첨가물</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><rect x="-26" y="-23" width="52" height="46" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-33,-30 H33 V30 H-33 Z" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">외부 첨가물</tspan></text></g><g class="sis-node" data-node="S" data-kind="substance"><title>대상</title><circle cx="593.3333333333334" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="593.3333333333334" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">대상</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  첨가 위치를 밖으로 이동</tspan></text><text x="43" y="347" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  외부에서 필요 작용</tspan></text></g><text x="32" y="423" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 대상 내부에 넣는 첨가제 대신 외부 첨가를 사용한다.</tspan></text><text x="32" y="459.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 내부 물질 첨가가 제약되어 외부 첨가로 그 역할을 대신하는 </tspan><tspan x="32" dy="24.8">경우.</tspan></text><text x="32" y="521.4000000000001" text-anchor="