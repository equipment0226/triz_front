ke="#547957" stroke-width="2" marker-end="url(#sis-detail-1-1-8-sub-1-1-8-2)"/><circle cx="300.0" cy="168.5" r="11" fill="white" stroke="#547957"/><text x="300.0" y="172.5" text-anchor="middle" fill="#547957" font-size="12"><tspan x="300.0" dy="0">3</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>전체 최소 장</title><circle cx="140.0" cy="264" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(140.0,264)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="140.0" y="334" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="140.0" dy="0">전체 최소 장</tspan></text></g><g class="sis-node" data-node="S3" data-kind="substance"><title>추가 장 생성 물질</title><circle cx="300.0" cy="264" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(300.0,264)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="300.0" y="334" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="300.0" dy="0">추가 장 생성 </tspan><tspan x="300.0" dy="26.35">물질</tspan></text></g><g class="sis-node" data-node="H" data-kind="substance"><title>최대 작용 영역</title><circle cx="460.0" cy="264" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(460.0,264)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="460.0" y="334" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="460.0" dy="0">최대 작용 영역</tspan></text></g><g class="sis-node" data-node="M" data-kind="substance"><title>최소 작용 영역</title><circle cx="620.0" cy="264" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,264)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="620.0" y="334" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">최소 작용 영역</tspan></text></g><text x="43" y="393" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  최소 작용 유지</tspan></text><text x="43" y="418" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  국소 추가 장으로 강화</tspan></text><text x="43" y="443" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  기본 장 작용</tspan></text></g><text x="32" y="519" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 전체 장은 최소 수준으로 유지하고 최대 작용이 필요한 영역에 추가 </tspan><tspan x="32" dy="24.8">국소 장을 만드는 물질을 도입한다.</tspan></text><text x="32" y="580.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 전체 최소 작용을 유지하면서 특정 영역에서만 큰 작용이 </tspan><tspan x="32" dy="24.8">필요할 때.</tspan></text><text x="32" y="642.2" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>