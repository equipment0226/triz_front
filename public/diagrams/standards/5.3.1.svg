<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 887.4999999999999" role="img" aria-label="5.3.1 물질의 상 상태 교체 개념도" data-standard-code="5.3.1" style="font-family:Arial,Malgun Gothic,sans-serif"><title>5.3.1 물질의 상 상태 교체 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-5-3-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 5.3.1</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">물질의 상 상태 교체</tspan></text><g data-standard="5.3.1" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 현재 상의 성질이 부적합</tspan></text><g class="sis-node" data-node="A" data-kind="substance"><title>동일 물질의 상 A</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">동일 물질의 상 A</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-5-3-1)"/><g data-standard="5.3.1" data-phase="after"><rect x="16" y="383" width="728" height="270" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 상 상태를 바꾸어 기능 확보</tspan></text><path class="sis-edge" data-source="A" data-target="B" data-style="action" d="M267.0,510 L493.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-3-1)"/><circle cx="380.0" cy="510" r="11" fill="white" stroke="#547957"/><text x="380.0" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="A" data-kind="substance"><title>상 A</title><circle cx="220.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,510)"><circle cx="0" cy="0" r="27" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/></g><text x="220.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">상 A</tspan></text></g><g class="sis-node" data-node="B" data-kind="fluid"><title>상 B</title><circle cx="540.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,510)"><rect x="-31" y="-27" width="62" height="54" rx="10" fill="#f0f5e7" stroke="#4c725e" stroke-width="2"/><path d="M-28,-8 Q-14,-17 0,-8 T28,-8" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-16" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="540.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">상 B</tspan></text></g><text x="43" y="612" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  상태 변화</tspan></text></g><text x="32" y="692" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">재료 종류를 추가하는 대신 기존 물질의 상을 바꾼다.</tspan></text><text x="32" y="728.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 새 물질 추가 없이 기존 물질의 상 상태 A → 상 상태 B</tspan></text><text x="32" y="765.5999999999999" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 다른 물질을 도입하지 않으면서 기존 물질의 이용 효과를 </tspan><tspan x="32" dy="24.8">높이려는 경우.</tspan></text><text x="32" y="827.1999999999999" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>