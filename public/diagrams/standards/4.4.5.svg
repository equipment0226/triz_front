<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 937.3" role="img" aria-label="4.4.5 자기 물리효과를 이용한 측정 개념도" data-standard-code="4.4.5" style="font-family:Arial,Malgun Gothic,sans-serif"><title>4.4.5 자기 물리효과를 이용한 측정 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-4-4-5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 4.4.5</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">자기 물리효과를 이용한 측정</tspan></text><g data-standard="4.4.5" data-phase="before"><rect x="16" y="93" width="728" height="245" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 자기 신호 변화가 부족함</tspan></text><g class="sis-node" data-node="S" data-kind="magnetic"><title>자기 측정계</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,220)"><path d="M-23,-20 V6 Q-23,29 0,29 Q23,29 23,6 V-20 H9 V6 Q9,14 0,14 Q-9,14 -9,6 V-20 Z" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="-16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="-16" dy="0">N</tspan></text><text x="16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="16" dy="0">S</tspan></text></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">자기 측정계</tspan></text></g></g><path d="M380,347 V374" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-4-4-5)"/><g data-standard="4.4.5" data-phase="after"><rect x="16" y="383" width="728" height="295" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 상태에 따른 자기 물성 변화를 검출</tspan></text><path class="sis-edge" data-source="P" data-target="S" data-style="action" d="M213.66666666666669,510 L333.0,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-4-5)"/><circle cx="273.33333333333337" cy="510" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="S" data-target="M" data-style="action" d="M427.0,510 L546.3333333333334,510" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-4-4-5)"/><circle cx="486.6666666666667" cy="510" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="514" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="P" data-kind="process"><title>온도·응력 등 상태</title><circle cx="166.66666666666669" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,510)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">온도·응력 등 상태</tspan></text></g><g class="sis-node" data-node="S" data-kind="magnetic"><title>자기 물성 변화</title><circle cx="380.0" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,510)"><path d="M-23,-20 V6 Q-23,29 0,29 Q23,29 23,6 V-20 H9 V6 Q9,14 0,14 Q-9,14 -9,6 V-20 Z" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="-16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="-16" dy="0">N</tspan></text><text x="16" y="-26" text-anchor="middle" fill="#273b43" font-size="11"><tspan x="16" dy="0">S</tspan></text></g><text x="380.0" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">자기 물성 변화</tspan></text></g><g class="sis-node" data-node="M" data-kind="sensor"><title>변화 신호 검출</title><circle cx="593.3333333333334" cy="510" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,510)"><rect x="-29" y="-23" width="58" height="42" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-23,5 L-14,5 L-7,-10 L2,12 L10,-3 L23,-3" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,20 V29 M-17,30 H17" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="580" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">변화 신호 검출</tspan></text></g><text x="43" y="612" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  자기 물리효과</tspan></text><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  측정 신호</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">예: 퀴리점·자기탄성 등. 효과별 조건을 따로 검토한다.</tspan></text><text x="32" y="753.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 기존 측정 Fe-Field → 자기 물성의 물리효과 활용 → 검출·측정 </tspan><tspan x="32" dy="24.8">성능 강화</tspan></text><text x="32" y="815.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · Fe-Field 측정계가 주어지고 그 효율을 높이려는 경우. </tspan><tspan x="32" dy="24.8">열거된 효과는 선택 가능한 예시이며 모두 동시에 적용하는 조건이 아니다.</tspan></text><text x="32" y="877.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>