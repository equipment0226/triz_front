<g data-standard="5.4.2" data-phase="after"><rect x="16" y="383" width="728" height="342" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="416" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 임계 상태의 저장 에너지를 방출</tspan></text><path class="sis-edge" data-source="E" data-target="C" data-style="action" d="M187.0,532 L253.0,532" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-4-2)"/><circle cx="220.0" cy="532" r="11" fill="white" stroke="#547957"/><text x="220.0" y="536" text-anchor="middle" fill="#547957" font-size="12"><tspan x="220.0" dy="0">1</tspan></text><path class="sis-edge" data-source="I" data-target="C" data-style="action" d="M413.0,532 L347.0,532" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-4-2)"/><circle cx="380.0" cy="532" r="11" fill="white" stroke="#547957"/><text x="380.0" y="536" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">2</tspan></text><path class="sis-edge" data-source="C" data-target="R" data-style="action" d="M300.0,489 C300.0,441 620.0,441 620.0,489" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-5-4-2)"/><circle cx="460.0" cy="453.0" r="11" fill="white" stroke="#547957"/><text x="460.0" y="457.0" text-anchor="middle" fill="#547957" font-size="12"><tspan x="460.0" dy="0">3</tspan></text><g class="sis-node" data-node="E" data-kind="energy"><title>저장 에너지</title><circle cx="140.0" cy="532" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(140.0,532)"><rect x="-26" y="-18" width="47" height="36" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="21" y="-8" width="6" height="16" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><path d="M-14,0 H-3 M-8,-6 V6 M6,0 H15" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="140.0" y="602" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="140.0" dy="0">저장 에너지</tspan></text></g><g class="sis-node" data-node="C" data-kind="critical"><title>임계 상태</title><circle cx="300.0" cy="532" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(300.0,532)"><path d="M-28,19 L0,-29 L28,19 Z" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,-11 V4" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="12" r="2.5" fill="#4c725e"/></g><text x="300.0" y="602" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="300.0" dy="0">임계 상태</tspan></text></g><g class="sis-node" data-node="I" data-kind="pulse"><title>작은 제어 입력</title><circle cx="460.0" cy="532" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(460.0,532)"><path d="M-27,5 H-19 V-14 H-6 V12 H7 V-14 H20 V5 H28" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="460.0" y="602" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="460.0" dy="0">작은 제어 입력</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>큰 출력</title><circle cx="620.0" cy="532" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(620.0,532)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="620.0" y="602" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="620.0" dy="0">큰 출력</tspan></text></g><text x="43" y="634" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  에너지 공급</tspan></text><text x="43" y="659" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  임계값 통과</tspan></text><text x="43" y="684" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">3  저장 에너지 방출</tspan></text></g><text x="32" y="764" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">출력 에너지원과 제어 신호를 별개의 노드로 표시한다.</tspan></text><text x="32" y="800.8" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 변환 물질에 에너지 저장 + 임계 상태 부근으로 준비 → 약한 </tspan><tspan x="32" dy="24.8">입력이 방아쇠로 작용 → 강한 출력 작용</tspan></text><text x="32" y="862.4" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 입력 작용은 약하지만 강한 출력 작용이 필요하고, 에너지를 </tspan><tspan x="32" dy="24.8">저장한 변환 물질을 임계 상태에 가깝게 두는 경우.</tspan></text><text x="32" y="924.0" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>