th="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,-11 V4" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="12" r="2.5" fill="#4c725e"/></g><text x="137" y="682.35" text-anchor="start" fill="#273b43" font-size="17"><tspan x="137" dy="0">약한 입력 신호가 방아쇠로 작용하여 강한 출력 작용을 </tspan><tspan x="137" dy="26.35">일으키게 한다.</tspan></text></g></g><text x="32" y="783.35" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 변환 물질에 에너지 저장 + 임계 상태 부근으로 준비 → 약한 </tspan><tspan x="32" dy="24.8">입력이 방아쇠로 작용 → 강한 출력 작용</tspan></text><text x="32" y="844.95" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 입력 작용은 약하지만 강한 출력 작용이 필요하고, 에너지를 </tspan><tspan x="32" dy="24.8">저장한 변환 물질을 임계 상태에 가깝게 두는 경우.</tspan></text><text x="32" y="906.5500000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 실제 적용·검증 결과가 아닙니다. 화살표의 의미는 각 관계 설명을 따릅니다.</tspan></text></svg>