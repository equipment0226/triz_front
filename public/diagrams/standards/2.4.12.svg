<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1016.1" role="img" aria-label="2.4.12 전기유변 현탁액 개념도" data-standard-code="2.4.12" style="font-family:Arial,Malgun Gothic,sans-serif"><title>2.4.12 전기유변 현탁액 · 개념도</title><rect width="100%" height="100%" rx="20" fill="#fcfdf8"/><defs><marker id="sis-2-4-12" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><text x="30" y="31" text-anchor="start" fill="#6a8654" font-size="13"><tspan x="30" dy="0">STANDARD 2.4.12</tspan></text><text x="30" y="63" text-anchor="start" fill="#273b43" font-size="21"><tspan x="30" dy="0">전기유변 현탁액</tspan></text><g data-standard="2.4.12" data-phase="before"><rect x="16" y="93" width="728" height="272" rx="18" fill="#f4f5ef" stroke="#d8e2cd"/><text x="37" y="126" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 전 · 자성유체를 적용할 수 없음</tspan></text><g class="sis-node" data-node="S" data-kind="missing"><title>사용할 수 없는 자성유체</title><circle cx="380.0" cy="220" r="43" fill="white" stroke="#ccd9bd" stroke-dasharray="4 4"/><g transform="translate(380.0,220)"><text x="0" y="13" text-anchor="middle" fill="#98a294" font-size="38"><tspan x="0" dy="0">?</tspan></text></g><text x="380.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">사용할 수 없는 </tspan><tspan x="380.0" dy="26.35">자성유체</tspan></text></g></g><path d="M380,374 V401" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-2-4-12)"/><g data-standard="2.4.12" data-phase="after"><rect x="16" y="410" width="728" height="322" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="443" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 전기장으로 유동 특성 변화</tspan></text><path class="sis-edge" data-source="F" data-target="S" data-style="action" d="M213.66666666666669,537 L333.0,537" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-4-12)"/><circle cx="273.33333333333337" cy="537" r="11" fill="white" stroke="#547957"/><text x="273.33333333333337" y="541" text-anchor="middle" fill="#547957" font-size="12"><tspan x="273.33333333333337" dy="0">1</tspan></text><path class="sis-edge" data-source="S" data-target="R" data-style="action" d="M427.0,537 L546.3333333333334,537" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-2-4-12)"/><circle cx="486.6666666666667" cy="537" r="11" fill="white" stroke="#547957"/><text x="486.6666666666667" y="541" text-anchor="middle" fill="#547957" font-size="12"><tspan x="486.6666666666667" dy="0">2</tspan></text><g class="sis-node" data-node="F" data-kind="field"><title>인가 전기장</title><circle cx="166.66666666666669" cy="537" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(166.66666666666669,537)"><path d="M-29,0 Q-22,-25 -14,0 T1,0 T16,0 T31,0" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="166.66666666666669" y="607" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="166.66666666666669" dy="0">인가 전기장</tspan></text></g><g class="sis-node" data-node="S" data-kind="chains"><title>입자 사슬 형성</title><circle cx="380.0" cy="537" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(380.0,537)"><rect x="-31" y="-27" width="62" height="54" rx="10" fill="#f0f5e7" stroke="#4c725e" stroke-width="2"/><circle cx="-19" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-3" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="13" cy="-16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="0" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-13" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="3" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="19" cy="16" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><path d="M-19,-16 L-13,16" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-3,-16 L3,16" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13,-16 L19,16" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380.0" y="607" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="380.0" dy="0">입자 사슬 형성</tspan></text></g><g class="sis-node" data-node="R" data-kind="process"><title>항복·유동 특성 변화</title><circle cx="593.3333333333334" cy="537" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(593.3333333333334,537)"><path d="M-26,0 H21 M8,-13 L22,0 L8,13" fill="none" stroke="#4c725e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="593.3333333333334" y="607" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="593.3333333333334" dy="0">항복·유동 특성 </tspan><tspan x="593.3333333333334" dy="26.35">변화</tspan></text></g><text x="43" y="666" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  입자 배열</tspan></text><text x="43" y="691" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">2  유변 특성 제어</tspan></text></g><text x="32" y="771" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">자성유체를 사용할 수 없을 때 전기유변 현탁액을 검토한다. 그림은 ER 현탁액의 </tspan><tspan x="32" dy="24.8">전기장 반응을 설명한다.</tspan></text><text x="32" y="832.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 적용할 수 없는 자성유체 → 전기장으로 점도·유동 저항을 조절하는 </tspan><tspan x="32" dy="24.8">전기유변 현탁액</tspan></text><text x="32" y="894.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 자성유체를 적용할 수 없고 전기유변 현탁액의 제어 가능한 </tspan><tspan x="32" dy="24.8">점도를 활용할 때.</tspan></text><text x="32" y="955.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>