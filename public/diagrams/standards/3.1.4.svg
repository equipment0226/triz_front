40.0" cy="220" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,220)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="290" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">시스템 B</tspan></text></g><text x="43" y="322" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  결합된 시스템</tspan></text></g><path d="M380,372 V399" stroke="#6f8b53" stroke-width="2" marker-end="url(#sis-3-1-4)"/><g data-standard="3.1.4" data-phase="after"><rect x="16" y="408" width="728" height="270" rx="18" fill="#ecf3e1" stroke="#d8e2cd"/><text x="37" y="441" text-anchor="start" fill="#273b43" font-size="17"><tspan x="37" dy="0">변환 후 · 보조 부분 우선 축약·공유</tspan></text><path class="sis-edge" data-source="C" data-target="R" data-style="action" d="M267.0,535 L493.0,535" fill="none" stroke="#547957" stroke-width="2" marker-end="url(#sis-3-1-4)"/><circle cx="380.0" cy="535" r="11" fill="white" stroke="#547957"/><text x="380.0" y="539" text-anchor="middle" fill="#547957" font-size="12"><tspan x="380.0" dy="0">1</tspan></text><g class="sis-node" data-node="C" data-kind="composite"><title>공유된 보조 부분</title><circle cx="220.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(220.0,535)"><rect x="-31" y="-27" width="62" height="54" rx="10" fill="#f0f5e7" stroke="#4c725e" stroke-width="2"/><circle cx="-16" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="-8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="-16" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="0" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/><circle cx="16" cy="8" r="3.7" fill="#809c67" stroke="#4c725e" stroke-width="1"/></g><text x="220.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="220.0" dy="0">공유된 보조 부분</tspan></text></g><g class="sis-node" data-node="R" data-kind="system"><title>축약된 단일 시스템</title><circle cx="540.0" cy="535" r="43" fill="white" stroke="#ccd9bd"/><g transform="translate(540.0,535)"><rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/><rect x="-23" y="-15" width="18" height="30" rx="5" fill="#dce8c7" stroke="#4c725e" stroke-width="2"/><rect x="4" y="-15" width="18" height="30" rx="5" fill="none" stroke="#4c725e" stroke-width="2"/></g><text x="540.0" y="605" text-anchor="middle" fill="#273b43" font-size="17"><tspan x="540.0" dy="0">축약된 단일 시스템</tspan></text></g><text x="43" y="637" text-anchor="start" fill="#61765a" font-size="15"><tspan x="43" dy="0">1  완전 축약 시 단일화</tspan></text></g><text x="32" y="717" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">보조 부분을 우선 줄인다. 완전히 축약된 뒤 새 수준에서 결합·축약 주기를 </tspan><tspan x="32" dy="24.8">반복할 수 있다.</tspan></text><text x="32" y="778.6" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">변환 원리 · 바이·폴리 시스템 → 보조 부분의 공유·축약 → 단일 시스템 → 새 </tspan><tspan x="32" dy="24.8">수준에서 주기 반복</tspan></text><text x="32" y="840.2" text-anchor="start" fill="#647b55" font-size="16"><tspan x="32" dy="0">원전 적용 조건 · 바이·폴리 시스템의 효율을 높이기 위해 축약하는 경우. </tspan><tspan x="32" dy="24.8">원전은 특히 보조 부분의 감소를 우선한다.</tspan></text><text x="32" y="901.8000000000001" text-anchor="start" fill="#647b55" font-size="13"><tspan x="32" dy="0">개념도 · 표준해의 관계를 설명하며 실제 적용·검증 결과가 아닙니다. 분기와 하위 방법은 각 상세 </tspan><tspan x="32" dy="20.150000000000002">도식에서 확인합니다.</tspan></text></svg>