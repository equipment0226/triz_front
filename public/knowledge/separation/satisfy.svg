<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="상반 요구의 동시 충족 개념도" data-diagram="separation-concept" data-approach-kind="SATISFY" data-catalog-version="matriz-pc-7-2026-09-29" style="font-family:Arial,Malgun Gothic,sans-serif"><title>상반 요구의 동시 충족 · 설명용 개념도</title><desc>접근의 일반적인 작동 구분을 설명한다. 실제 적용안이나 검증된 결과를 나타내지 않는다.</desc><rect width="720" height="380" rx="18" fill="#f5f7f0"/><text x="28" y="36" font-size="23" text-anchor="start" fill="#253e34">상반 요구의 동시 충족</text><text x="692" y="35" font-size="14" text-anchor="end" fill="#253e34">2가지 보완 접근 · 설명용 개념도</text><g data-mechanism="satisfy"><rect x="240" y="121" width="235" height="104" rx="12" fill="#dce9ce" stroke="#547460" stroke-width="2"/><text x="357" y="158" font-size="16" text-anchor="middle" fill="#253e34">두 기능을 함께 만드는</text><text x="357" y="187" font-size="18" text-anchor="middle" fill="#253e34">인과 메커니즘</text><path d="M480,149 L540,117" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="540.00,117.00 528.82,117.29 533.53,126.12" fill="#547460"/><path d="M480,194 L540,225" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="540.00,225.00 533.41,215.97 528.82,224.85" fill="#547460"/><rect x="547" y="82" width="135" height="61" rx="12" fill="#dfedf8" stroke="#547460" stroke-width="2"/><rect x="547" y="204" width="135" height="61" rx="12" fill="#fae5ca" stroke="#547460" stroke-width="2"/><text x="614" y="119" font-size="15" text-anchor="middle" fill="#253e34">요구 A 충족</text><text x="614" y="241" font-size="15" text-anchor="middle" fill="#253e34">요구 B 충족</text><text x="124" y="153" font-size="15" text-anchor="middle" fill="#253e34">동일한 운전에서</text><text x="124" y="179" font-size="15" text-anchor="middle" fill="#253e34">필수 기능 유지</text><path d="M184,171 L230,171" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="230.00,171.00 220.00,166.00 220.00,176.00" fill="#547460"/></g><text x="360" y="301" font-size="14" text-anchor="middle" fill="#253e34">두 요구를 함께 만족시키는 기능적 인과 경로를 찾는다.</text><text x="360" y="323" font-size="14" text-anchor="middle" fill="#253e34">같은 속성의 A와 not-A가 설명 없이 동시에 성립한다고 주장하지 않는다.</text></svg>