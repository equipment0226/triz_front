<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="5가지 분리와 2가지 보완 접근" data-diagram="separation-overview" style="font-family:Arial,Malgun Gothic,sans-serif"><rect width="720" height="470" rx="18" fill="#f5f7f0"/><text x="24" y="33" font-size="20" text-anchor="start" fill="#253e34">물리적 모순 해결 · 5가지 분리 + 2가지 보완 접근</text><text x="24" y="73" font-size="17" text-anchor="start" fill="#253e34">분리 접근 5가지</text><text x="470" y="73" font-size="17" text-anchor="start" fill="#253e34">보완 접근 2가지</text><g data-approach-kind="SPACE"><rect x="24" y="88" width="420" height="58" rx="12" fill="white" stroke="#547460" stroke-width="2"/><text x="42" y="111" font-size="17" text-anchor="start" fill="#253e34">공간 분리</text><text x="42" y="133" font-size="14" text-anchor="start" fill="#253e34">어디에서?</text></g><g data-approach-kind="TIME"><rect x="24" y="154" width="420" height="58" rx="12" fill="white" stroke="#547460" stroke-width="2"/><text x="42" y="177" font-size="17" text-anchor="start" fill="#253e34">시간 분리</text><text x="42" y="199" font-size="14" text-anchor="start" fill="#253e34">언제?</text></g><g data-approach-kind="CONDITION"><rect x="24" y="220" width="420" height="58" rx="12" fill="white" stroke="#547460" stroke-width="2"/><text x="42" y="243" font-size="17" text-anchor="start" fill="#253e34">관계(조건) 분리</text><text x="42" y="265" font-size="14" text-anchor="start" fill="#253e34">누구에게 / 어떤 대상에 대해?</text></g><g data-approach-kind="DIRECTION"><rect x="24" y="286" width="420" height="58" rx="12" fill="white" stroke="#547460" stroke-width="2"/><text x="42" y="309" font-size="17" text-anchor="start" fill="#253e34">방향 분리</text><text x="42" y="331" font-size="14" text-anchor="start" fill="#253e34">어느 방향으로?</text></g><g data-approach-kind="SYSTEM_LEVEL"><rect x="24" y="352" width="420" height="58" rx="12" fill="white" stroke="#547460" stroke-width="2"/><text x="42" y="375" font-size="17" text-anchor="start" fill="#253e34">시스템 수준 분리</text><text x="42" y="397" font-size="14" text-anchor="start" fill="#253e34">부분과 전체의 성질을 구분 · 항상 검토</text></g><g data-approach-kind="SATISFY"><rect x="470" y="88" width="226" height="157" rx="12" fill="#dfedf8" stroke="#547460" stroke-width="2"/><text x="486" y="117" font-size="17" text-anchor="start" fill="#253e34">상반 요구의 동시 </text><text x="486" y="142" font-size="17" text-anchor="start" fill="#253e34">충족</text><text x="486" y="193" font-size="14" text-anchor="start" fill="#253e34">기능적 인과 경로를 찾아</text><text x="486" y="216" font-size="14" text-anchor="start" fill="#253e34">두 요구를 함께 만족</text></g><g data-approach-kind="BYPASS"><rect x="470" y="253" width="226" height="157" rx="12" fill="#dce9ce" stroke="#547460" stroke-width="2"/><text x="486" y="282" font-size="17" text-anchor="start" fill="#253e34">모순 요구 우회</text><text x="486" y="358" font-size="14" text-anchor="start" fill="#253e34">필수 기능과 목적은 유지</text><text x="486" y="381" font-size="14" text-anchor="start" fill="#253e34">기존 모순의 전제를 우회</text></g><text x="24" y="445" font-size="14" text-anchor="start" fill="#253e34">분류 안내용 개념도 · 실제 검토 여부와 적용 가능성은 분석 기록을 따른다.</text></svg>