<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="공간 분리 개념도" data-diagram="separation-concept" data-approach-kind="SPACE" data-catalog-version="matriz-pc-7-2026-09-29" style="font-family:Arial,Malgun Gothic,sans-serif"><title>공간 분리 · 설명용 개념도</title><desc>접근의 일반적인 작동 구분을 설명한다. 실제 적용안이나 검증된 결과를 나타내지 않는다.</desc><rect width="720" height="380" rx="18" fill="#f5f7f0"/><text x="28" y="36" font-size="23" text-anchor="start" fill="#253e34">공간 분리</text><text x="692" y="35" font-size="14" text-anchor="end" fill="#253e34">5가지 분리 접근 · 설명용 개념도</text><g data-mechanism="space"><rect x="130" y="107" width="460" height="112" rx="12" fill="white" stroke="#547460" stroke-width="2"/><rect x="142" y="119" width="216" height="88" rx="12" fill="#dfedf8" stroke="#547460" stroke-width="2"/><rect x="362" y="119" width="216" height="88" rx="12" fill="#dce9ce" stroke="#547460" stroke-width="2"/><path d="M360,101 V227" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><text x="250" y="167" font-size="17" text-anchor="middle" fill="#253e34">부위 1 · 요구 A</text><text x="470" y="167" font-size="17" text-anchor="middle" fill="#253e34">부위 2 · 요구 B</text><text x="360" y="249" font-size="15" text-anchor="middle" fill="#253e34">같은 시스템 안의 서로 다른 위치</text></g><text x="360" y="301" font-size="14" text-anchor="middle" fill="#253e34">상반된 요구를 서로 다른 위치에 배치한다.</text><text x="360" y="323" font-size="14" text-anchor="middle" fill="#253e34">각 위치에서 필요한 기능과 두 위치 사이의 연결을 확인한다.</text></svg>