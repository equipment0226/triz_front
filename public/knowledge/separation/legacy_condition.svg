<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="조건 분리 개념도" data-diagram="separation-concept" data-approach-kind="CONDITION" data-catalog-version="legacy-separation-4-v1" style="font-family:Arial,Malgun Gothic,sans-serif"><title>조건 분리 · 설명용 개념도</title><desc>접근의 일반적인 작동 구분을 설명한다. 실제 적용안이나 검증된 결과를 나타내지 않는다.</desc><rect width="720" height="380" rx="18" fill="#f5f7f0"/><text x="28" y="36" font-size="23" text-anchor="start" fill="#253e34">조건 분리</text><text x="692" y="35" font-size="14" text-anchor="end" fill="#253e34">과거 4종 분리 체계 · 설명용 개념도</text><g data-mechanism="condition-legacy"><path d="M110,205 L610,205" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="610.00,205.00 600.00,200.00 600.00,210.00" fill="#547460"/><path d="M360,101 V227" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="130" y="113" width="200" height="70" rx="12" fill="#dfedf8" stroke="#547460" stroke-width="2"/><rect x="390" y="113" width="200" height="70" rx="12" fill="#dce9ce" stroke="#547460" stroke-width="2"/><text x="230" y="154" font-size="17" text-anchor="middle" fill="#253e34">조건 범위 1 · A</text><text x="490" y="154" font-size="17" text-anchor="middle" fill="#253e34">조건 범위 2 · B</text><text x="360" y="249" font-size="15" text-anchor="middle" fill="#253e34">온도·하중 등 저장된 조건 구분</text></g><text x="360" y="301" font-size="14" text-anchor="middle" fill="#253e34">과거 4종 체계의 넓은 조건 분리를 설명하는 개념도이다.</text><text x="360" y="323" font-size="14" text-anchor="middle" fill="#253e34">새 관계(조건) 분리로 재분류하지 않으며 실제 조건은 원 기록을 따른다.</text></svg>