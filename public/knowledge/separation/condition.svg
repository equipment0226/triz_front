<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="관계(조건) 분리 개념도" data-diagram="separation-concept" data-approach-kind="CONDITION" data-catalog-version="matriz-pc-7-2026-09-29" style="font-family:Arial,Malgun Gothic,sans-serif"><title>관계(조건) 분리 · 설명용 개념도</title><desc>접근의 일반적인 작동 구분을 설명한다. 실제 적용안이나 검증된 결과를 나타내지 않는다.</desc><rect width="720" height="380" rx="18" fill="#f5f7f0"/><text x="28" y="36" font-size="23" text-anchor="start" fill="#253e34">관계(조건) 분리</text><text x="692" y="35" font-size="14" text-anchor="end" fill="#253e34">5가지 분리 접근 · 설명용 개념도</text><g data-mechanism="condition"><rect x="275" y="106" width="170" height="120" rx="12" fill="#dce9ce" stroke="#547460" stroke-width="2"/><text x="360" y="150" font-size="17" text-anchor="middle" fill="#253e34">같은 시스템</text><text x="360" y="178" font-size="15" text-anchor="middle" fill="#253e34">선택적 관계</text><circle cx="130" cy="164" r="48" fill="#dfedf8" stroke="#547460" stroke-width="2"/><circle cx="590" cy="164" r="48" fill="#fae5ca" stroke="#547460" stroke-width="2"/><text x="130" y="171" font-size="17" text-anchor="middle" fill="#253e34">대상 1</text><text x="590" y="171" font-size="17" text-anchor="middle" fill="#253e34">대상 2</text><path d="M271,147 L184,147" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="184.00,147.00 194.00,152.00 194.00,142.00" fill="#547460"/><path d="M449,183 L536,183" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="536.00,183.00 526.00,178.00 526.00,188.00" fill="#547460"/><text x="222" y="130" font-size="15" text-anchor="middle" fill="#253e34">요구 A</text><text x="497" y="210" font-size="15" text-anchor="middle" fill="#253e34">요구 B</text><text x="360" y="250" font-size="15" text-anchor="middle" fill="#253e34">누구에게 / 어떤 대상에 대해 작용하는가</text></g><text x="360" y="301" font-size="14" text-anchor="middle" fill="#253e34">서로 다른 대상과의 관계에 따라 상반된 요구를 충족한다.</text><text x="360" y="323" font-size="14" text-anchor="middle" fill="#253e34">온도·하중의 임계값만 바뀌는 것을 관계 분리로 단정하지 않는다.</text></svg>