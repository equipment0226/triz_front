<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="모순 요구 우회 개념도" data-diagram="separation-concept" data-approach-kind="BYPASS" data-catalog-version="matriz-pc-7-2026-09-29" style="font-family:Arial,Malgun Gothic,sans-serif"><title>모순 요구 우회 · 설명용 개념도</title><desc>접근의 일반적인 작동 구분을 설명한다. 실제 적용안이나 검증된 결과를 나타내지 않는다.</desc><rect width="720" height="380" rx="18" fill="#f5f7f0"/><text x="28" y="36" font-size="23" text-anchor="start" fill="#253e34">모순 요구 우회</text><text x="692" y="35" font-size="14" text-anchor="end" fill="#253e34">2가지 보완 접근 · 설명용 개념도</text><g data-mechanism="bypass"><rect x="32" y="141" width="130" height="62" rx="12" fill="#dfedf8" stroke="#547460" stroke-width="2"/><text x="97" y="179" font-size="17" text-anchor="middle" fill="#253e34">필수 기능</text><rect x="268" y="84" width="193" height="61" rx="12" fill="#f2f2ef" stroke="#547460" stroke-width="2"/><text x="364" y="121" font-size="16" text-anchor="middle" fill="#253e34">기존 모순 경로</text><path d="M168,156 L259,114" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polygon points="259.00,114.00 247.83,113.65 252.02,122.73" fill="#547460"/><path d="M469,114 L552,156" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polygon points="552.00,156.00 545.33,147.02 540.82,155.95" fill="#547460"/><path d="M341,91 L387,137 M387,91 L341,137" fill="none" stroke="#a56458" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="251" y="211" width="226" height="61" rx="12" fill="#dce9ce" stroke="#547460" stroke-width="2"/><text x="364" y="248" font-size="16" text-anchor="middle" fill="#253e34">다른 기능 실현 방식</text><path d="M167,189 L242,238" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="242.00,238.00 236.36,228.34 230.89,236.72" fill="#547460"/><path d="M485,238 L552,189" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="552.00,189.00 540.98,190.87 546.88,198.94" fill="#547460"/><rect x="560" y="141" width="130" height="62" rx="12" fill="#dfedf8" stroke="#547460" stroke-width="2"/><text x="625" y="179" font-size="17" text-anchor="middle" fill="#253e34">같은 목적</text></g><text x="360" y="301" font-size="14" text-anchor="middle" fill="#253e34">필수 기능을 다른 방식으로 수행해 기존 모순의 전제를 없앤다.</text><text x="360" y="323" font-size="14" text-anchor="middle" fill="#253e34">상위 목적·필수 기능·승인된 제약을 없애는 방식은 우회 해결이 아니다.</text></svg>