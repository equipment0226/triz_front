<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="시스템 수준 분리 개념도" data-diagram="separation-concept" data-approach-kind="SYSTEM_LEVEL" data-catalog-version="matriz-pc-7-2026-09-29" style="font-family:Arial,Malgun Gothic,sans-serif"><title>시스템 수준 분리 · 설명용 개념도</title><desc>접근의 일반적인 작동 구분을 설명한다. 실제 적용안이나 검증된 결과를 나타내지 않는다.</desc><rect width="720" height="380" rx="18" fill="#f5f7f0"/><text x="28" y="36" font-size="23" text-anchor="start" fill="#253e34">시스템 수준 분리</text><text x="692" y="35" font-size="14" text-anchor="end" fill="#253e34">5가지 분리 접근 · 설명용 개념도</text><g data-mechanism="system_level"><rect x="136" y="91" width="448" height="158" rx="12" fill="white" stroke="#547460" stroke-width="2"/><text x="360" y="120" font-size="17" text-anchor="middle" fill="#253e34">전체 수준 · 요구 B</text><path d="M205,183 H515" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><circle cx="218" cy="186" r="40" fill="#dfedf8" stroke="#547460" stroke-width="2"/><text x="218" y="191" font-size="16" text-anchor="middle" fill="#253e34">부분 A</text><circle cx="360" cy="186" r="40" fill="#dfedf8" stroke="#547460" stroke-width="2"/><text x="360" y="191" font-size="16" text-anchor="middle" fill="#253e34">부분 A</text><circle cx="502" cy="186" r="40" fill="#dfedf8" stroke="#547460" stroke-width="2"/><text x="502" y="191" font-size="16" text-anchor="middle" fill="#253e34">부분 A</text></g><text x="360" y="301" font-size="14" text-anchor="middle" fill="#253e34">부분의 성질과 결합된 전체의 성질을 다르게 구성한다.</text><text x="360" y="323" font-size="14" text-anchor="middle" fill="#253e34">항상 검토하는 접근이지만 해당 문제에서 성립한다는 뜻은 아니다.</text></svg>