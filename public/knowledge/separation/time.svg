<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="시간 분리 개념도" data-diagram="separation-concept" data-approach-kind="TIME" data-catalog-version="matriz-pc-7-2026-09-29" style="font-family:Arial,Malgun Gothic,sans-serif"><title>시간 분리 · 설명용 개념도</title><desc>접근의 일반적인 작동 구분을 설명한다. 실제 적용안이나 검증된 결과를 나타내지 않는다.</desc><rect width="720" height="380" rx="18" fill="#f5f7f0"/><text x="28" y="36" font-size="23" text-anchor="start" fill="#253e34">시간 분리</text><text x="692" y="35" font-size="14" text-anchor="end" fill="#253e34">5가지 분리 접근 · 설명용 개념도</text><g data-mechanism="time"><path d="M95,218 L635,218" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="635.00,218.00 625.00,213.00 625.00,223.00" fill="#547460"/><text x="650" y="223" font-size="14" text-anchor="middle" fill="#253e34">시간</text><rect x="120" y="109" width="205" height="83" rx="12" fill="#dfedf8" stroke="#547460" stroke-width="2"/><rect x="395" y="109" width="205" height="83" rx="12" fill="#dce9ce" stroke="#547460" stroke-width="2"/><text x="222" y="154" font-size="17" text-anchor="middle" fill="#253e34">시점 t₁ · 요구 A</text><text x="497" y="154" font-size="17" text-anchor="middle" fill="#253e34">시점 t₂ · 요구 B</text><path d="M337,150 L384,150" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="384.00,150.00 374.00,145.00 374.00,155.00" fill="#547460"/><text x="360" y="130" font-size="14" text-anchor="middle" fill="#253e34">전환</text><path d="M222,207 V230 M497,207 V230" fill="none" stroke="#547460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="249" font-size="15" text-anchor="middle" fill="#253e34">동일 대상의 상태를 필요한 시점에 바꾼다</text></g><text x="360" y="301" font-size="14" text-anchor="middle" fill="#253e34">상반된 요구가 필요한 시점을 구분한다.</text><text x="360" y="323" font-size="14" text-anchor="middle" fill="#253e34">전환 시간·방법과 상태 전환 중의 기능 유지도 검토한다.</text></svg>